name: emkeel-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so check_maint_scope can diff against the base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install emkeel
        run: pip install "emkeel~=0.1.0"
      - name: "Gate - ticket link"
        if: github.event_name == 'pull_request'
        env:
          EMKEEL_BRANCH: ${{ github.head_ref }}
          EMKEEL_PR_TITLE: ${{ github.event.pull_request.title }}
          # Secrets let the gate verify the ticket EXISTS in Jira (404 -> hard fail). Absent -> syntax-only warning.
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python -m emkeel.gates.check_ticket_link
      - name: "Gate - ticket precedes work (ticket-first)"
        if: github.event_name == 'pull_request'
        env:
          EMKEEL_BRANCH: ${{ github.head_ref }}
          EMKEEL_PR_TITLE: ${{ github.event.pull_request.title }}
          EMKEEL_BASE_REF: ${{ github.base_ref }}
          # Compares Jira's `created` to the branch's first commit (ticket-first). Secrets absent -> inconclusive warning.
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python -m emkeel.gates.check_ticket_precedes_work
      - name: "Gate - maintenance scope (emkeel-maint lane only)"
        if: github.event_name == 'pull_request'
        env:
          EMKEEL_BRANCH: ${{ github.head_ref }}
          EMKEEL_BASE_REF: ${{ github.base_ref }}
        run: python -m emkeel.gates.check_maint_scope
      - name: "Gate - dependabot scope (dependabot lane only)"
        if: github.event_name == 'pull_request'
        env:
          EMKEEL_BRANCH: ${{ github.head_ref }}
          EMKEEL_BASE_REF: ${{ github.base_ref }}
        run: python -m emkeel.gates.check_dependabot_scope
      - name: "Gate - plan present (features)"
        if: github.event_name == 'pull_request'
        env:
          EMKEEL_BRANCH: ${{ github.head_ref }}
        run: python -m emkeel.gates.check_plan_present
      - name: "Gate - acceptance criteria (features)"
        if: github.event_name == 'pull_request'
        env:
          EMKEEL_BRANCH: ${{ github.head_ref }}
        run: python -m emkeel.gates.check_acceptance_criteria
      - name: "Gate - strategy link (features; dormant until a strategy exists)"
        if: github.event_name == 'pull_request'
        env:
          EMKEEL_BRANCH: ${{ github.head_ref }}
        run: python -m emkeel.gates.check_strategy_link
      - name: "Gate - strategy quality (every strategy doc is sourced + complete)"
        if: github.event_name == 'pull_request'
        run: python -m emkeel.gates.check_strategy_quality
      - name: "Gate - strategy change (north star only on a strategy/ lane)"
        if: github.event_name == 'pull_request'
        env:
          EMKEEL_BRANCH: ${{ github.head_ref }}
          EMKEEL_BASE_REF: ${{ github.base_ref }}
        run: python -m emkeel.gates.check_strategy_change
      - name: "Gate - strategy process (non-skippable steps: <topic>.process.json >= validated + provenance)"
        if: github.event_name == 'pull_request'
        env:
          EMKEEL_BASE_REF: ${{ github.base_ref }}
        run: python -m emkeel.gates.check_strategy_process
      - name: "Tests - this repo's own suite (declared in emkeel.toml [tests].command)"
        # The maint lane carries only generated wiring (proven by check_maint_scope), so YOUR product suite
        # cannot be affected by it — and running it anyway makes emkeel's wiring refresh hostage to an
        # unrelated failure in your codebase (KEEL-156).
        if: ${{ !startsWith(github.head_ref, 'emkeel-maint/') }}
        env:
          EMKEEL_TEST_CMD: ''
        run: |
          CMD="$EMKEEL_TEST_CMD"
          if [ -z "$CMD" ]; then
            echo "::warning::No [tests].command in emkeel.toml — this PR runs NO tests. A regression can"
            echo "::warning::merge green. Declare it with: emkeel set test-command <your command>"
          else
            echo "Running: $CMD"
            bash -lc "$CMD"
          fi
      - name: "Gate - branch prefix vocabulary (an unknown prefix silently disables the feature gates)"
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EMKEEL_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python -m emkeel.gates.check_branch_vocabulary
      - name: "Gate - a bug fix carries a test (regression guard)"
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EMKEEL_BRANCH: ${{ github.head_ref || github.ref_name }}
          EMKEEL_BASE_REF: ${{ github.base_ref || 'main' }}
        run: python -m emkeel.gates.check_fix_has_test
      - name: "Gate - Conventional Commits with the ticket KEY"
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EMKEEL_BRANCH: ${{ github.head_ref || github.ref_name }}
          EMKEEL_BASE_REF: ${{ github.base_ref || 'main' }}
        run: python -m emkeel.gates.check_commit_convention
      - name: "Gate - an architectural change is answered (an ADR, or a declared no-adr)"
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EMKEEL_BRANCH: ${{ github.head_ref || github.ref_name }}
          EMKEEL_BASE_REF: ${{ github.base_ref || 'main' }}
        run: python -m emkeel.gates.check_adr_for_architecture
      - name: "Gate - a changed decision reaches the runbook"
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EMKEEL_BRANCH: ${{ github.head_ref || github.ref_name }}
          EMKEEL_BASE_REF: ${{ github.base_ref || 'main' }}
        run: python -m emkeel.gates.check_refinement_reaches_the_runbook
      - name: "Gate - a runbook piece marked done actually resolves"
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EMKEEL_BRANCH: ${{ github.head_ref || github.ref_name }}
          EMKEEL_BASE_REF: ${{ github.base_ref || 'main' }}
        run: python -m emkeel.gates.check_runbook_claims
      - name: "Gate - a runbook piece marked done carries the ticket-discipline (agreement + back-link)"
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EMKEEL_BRANCH: ${{ github.head_ref || github.ref_name }}
          EMKEEL_BASE_REF: ${{ github.base_ref || 'main' }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python -m emkeel.gates.check_piece_ticket_discipline
      - name: "Gate - a change to the package bumps the version"
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EMKEEL_BRANCH: ${{ github.head_ref || github.ref_name }}
          EMKEEL_BASE_REF: ${{ github.base_ref || 'main' }}
        run: python -m emkeel.gates.check_version_bumped
      - name: "Gate - a spec names a ticket that exists"
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EMKEEL_BASE_REF: ${{ github.base_ref || 'main' }}
        run: python -m emkeel.gates.check_spec_ticket_exists
      - name: "Gate - critical change needs an integration test (tests/integration/)"
        if: github.event_name == 'pull_request'
        env:
          EMKEEL_BASE_REF: ${{ github.base_ref }}
        run: python -m emkeel.gates.check_critical_integration
      - name: "Gate - governance-doc conventions (canonical English fields + bidirectional ADR supersession)"
        if: github.event_name == 'pull_request'
        run: python -m emkeel.gates.check_doc_conventions
      - name: "Gate - strategy alignment (feature acknowledges the north star)"
        if: github.event_name == 'pull_request'
        env:
          EMKEEL_BRANCH: ${{ github.head_ref }}
        run: python -m emkeel.gates.check_strategy_alignment
      - name: "Gate - code-health ratchet (declared checks; debt only decreases)"
        if: github.event_name == 'pull_request'
        env:
          EMKEEL_BASE_REF: ${{ github.base_ref }}
        run: python -m emkeel.gates.check_code_health
