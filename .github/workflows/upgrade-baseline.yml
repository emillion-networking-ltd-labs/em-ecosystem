# ============================================================================
# Pre-Upgrade Baseline — SCRUM-380
# ============================================================================
# Run BEFORE starting a major framework migration ticket. Captures the
# current visual + a11y + console-clean state and commits it under
# `tests/e2e/upgrade-baselines/<migration_ticket>/` so the migration's PR
# can validate that the upgrade did not regress those guarantees.
#
# Distinct from `visual-regression.yml`:
#  - visual-regression.yml: ongoing baseline that every PR validates against
#  - upgrade-baseline.yml: snapshot-in-time linked to a specific migration
#                          ticket; used as a rollback / audit-trail artifact
# ============================================================================

name: Upgrade Baseline (pre-migration snapshot)

on:
  workflow_dispatch:
    inputs:
      migration_ticket:
        description: "Jira key of the migration ticket (e.g. SCRUM-381)"
        required: true
      target_packages:
        description: "Which package(s) to baseline"
        required: true
        type: choice
        default: "both"
        options:
          - dashboard
          - satellite
          - both

permissions:
  contents: write

jobs:
  capture-dashboard:
    name: Dashboard pre-upgrade baseline
    if: inputs.target_packages == 'dashboard' || inputs.target_packages == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: nexacore-dashboard/package-lock.json

      - name: Install + Playwright
        working-directory: nexacore-dashboard
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run snapshots (visual + a11y, capture mode)
        working-directory: nexacore-dashboard
        env:
          VRT: "1"
          NEXT_PUBLIC_VRT_BYPASS_AUTH: "1"
        run: |
          set -e
          npm run dev &
          DEV_PID=$!
          npx wait-on http://localhost:3001 -t 90000
          # Visual baseline (snapshots written to tests/e2e/visual.spec.ts-snapshots/)
          npx playwright test visual.spec.ts --update-snapshots --workers=1 --reporter=list
          # a11y baseline — record current violations (info only, doesn't fail)
          npx playwright test a11y.spec.ts --workers=1 --reporter=json > a11y-baseline.json || true
          kill $DEV_PID || true
        timeout-minutes: 30

      - name: Stage baseline under upgrade-baselines/<ticket>/
        working-directory: nexacore-dashboard
        run: |
          set -e
          DEST="tests/e2e/upgrade-baselines/${{ inputs.migration_ticket }}"
          mkdir -p "$DEST/visual" "$DEST/a11y"
          cp -r tests/e2e/visual.spec.ts-snapshots/* "$DEST/visual/" 2>/dev/null || echo "No snapshots produced"
          [ -f a11y-baseline.json ] && mv a11y-baseline.json "$DEST/a11y/baseline.json" || true
          # Tag with the source ref so we know what we baselined.
          {
            echo "Migration ticket: ${{ inputs.migration_ticket }}"
            echo "Baseline ref: $(git rev-parse HEAD)"
            echo "Captured at: $(date -u --iso-8601=seconds)"
            echo "Runner: ubuntu-latest"
          } > "$DEST/manifest.txt"

      - name: Commit + push dashboard baseline
        working-directory: nexacore-dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/upgrade-baselines/${{ inputs.migration_ticket }}/
          if git diff --staged --quiet; then
            echo "No baseline files to commit"
            exit 0
          fi
          git commit -m "chore(${{ inputs.migration_ticket }}): pre-upgrade baseline (dashboard) [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

  capture-satellite:
    name: Satellite pre-upgrade baseline
    if: inputs.target_packages == 'satellite' || inputs.target_packages == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: satellites/sat-cristian-garcia/package-lock.json

      - name: Install + Playwright
        working-directory: satellites/sat-cristian-garcia
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run snapshots (visual + a11y, capture mode)
        working-directory: satellites/sat-cristian-garcia
        env:
          VRT: "1"
        run: |
          set -e
          npm run dev &
          DEV_PID=$!
          npx wait-on http://localhost:3002 -t 90000
          npx playwright test visual.spec.ts --update-snapshots --workers=1 --reporter=list
          npx playwright test a11y.spec.ts --workers=1 --reporter=json > a11y-baseline.json || true
          kill $DEV_PID || true
        timeout-minutes: 30

      - name: Stage baseline under upgrade-baselines/<ticket>/
        working-directory: satellites/sat-cristian-garcia
        run: |
          set -e
          DEST="tests/e2e/upgrade-baselines/${{ inputs.migration_ticket }}"
          mkdir -p "$DEST/visual" "$DEST/a11y"
          cp -r tests/e2e/visual.spec.ts-snapshots/* "$DEST/visual/" 2>/dev/null || echo "No snapshots produced"
          [ -f a11y-baseline.json ] && mv a11y-baseline.json "$DEST/a11y/baseline.json" || true
          {
            echo "Migration ticket: ${{ inputs.migration_ticket }}"
            echo "Baseline ref: $(git rev-parse HEAD)"
            echo "Captured at: $(date -u --iso-8601=seconds)"
            echo "Runner: ubuntu-latest"
          } > "$DEST/manifest.txt"

      - name: Commit + push satellite baseline
        working-directory: satellites/sat-cristian-garcia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/upgrade-baselines/${{ inputs.migration_ticket }}/
          if git diff --staged --quiet; then
            echo "No baseline files to commit"
            exit 0
          fi
          git commit -m "chore(${{ inputs.migration_ticket }}): pre-upgrade baseline (satellite) [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
