# ============================================================================
# EM NexaCore — Security Pipeline
# ============================================================================
# SECURITY ONLY (ECO-215 split): Secrets Detection, Dependency Audit, SAST.
# Tests + Build moved to test-build.yml (they are correctness/build gates, not
# security). Per-package: SAST runs only when its package changed (PR) or always
# (push). The Security Gate is the single REQUIRED check — always runs and
# aggregates, so skipped per-package jobs never deadlock the merge.
# Standards: OWASP A06:2021, NIST SA-11, SOC 2 CC8.2, CWE-798.
# ============================================================================

name: Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write
  pull-requests: read # dorny/paths-filter reads the PR's changed files via the API (see test-build.yml)

env:
  NODE_VERSION: "22"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: "Detect changed packages"
    runs-on: self-hosted
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'nexacore-api/**'
            frontend:
              - 'nexacore-dashboard/**'

  # ==========================================================================
  # Layer 1: Secrets Detection (Gitleaks) — always runs (secrets can be anywhere)
  # Standard: CWE-798 (Hard-coded Credentials), OWASP A07:2021
  # ==========================================================================
  secrets-scan:
    name: "Layer 1: Secrets Detection"
    runs-on: self-hosted
    # Runs the gitleaks BINARY (open-source, free), NOT the action wrapper: gitleaks-action@v2 introduced
    # PAID license enforcement for ORGANIZATIONS (GITLEAKS_LICENSE secret) and, when missing, aborted with
    # "missing gitleaks license" BEFORE scanning — turning this job and the Security Gate red on EVERY org PR
    # (ECO-94). The binary does the same scan without a license. It no longer posts a PR comment, so
    # contents:read suffices (pull-requests:write was for that action comment — ECO-6).
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Scans ONLY the range introduced by the PR/push (what the action did), with the binary + .gitleaks.toml.
      # Catches NEW secrets without re-scanning the whole history: neither drowns the gate with old doc
      # placeholders nor needs a license. fetch-depth: 0 gives the full base..head range.
      - name: Run Gitleaks (pinned binary — no org license)
        env:
          GL_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GL_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          VERSION="8.18.4"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          ZERO="0000000000000000000000000000000000000000"
          if [ -n "${GL_BASE:-}" ] && [ "$GL_BASE" != "$ZERO" ] && git cat-file -e "${GL_BASE}^{commit}" 2>/dev/null; then
            echo "Scanning range ${GL_BASE}..${GL_HEAD}"
            /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose \
              --exit-code 1 --log-opts="--no-merges ${GL_BASE}..${GL_HEAD}"
          else
            echo "No valid base (new branch / first push): scanning the last commit"
            /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose \
              --exit-code 1 --log-opts="--no-merges -1"
          fi

  # ==========================================================================
  # Layer 2: Dependency Audit — per discovered package (api + dashboard + satellites)
  # Standard: OWASP A06:2021 (Vulnerable Components), NIST SA-11
  # ==========================================================================
  # ECO-27 (F3a): discovers satellites by glob so they enter the gates WITHOUT editing the workflow.
  discover-satellites:
    name: "Discover satellites"
    runs-on: self-hosted
    outputs:
      audit-packages: ${{ steps.find.outputs.audit-packages }}
      satellites: ${{ steps.find.outputs.satellites }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - id: find
        run: |
          sats=$(ls -d satellites/sat-*/ 2>/dev/null | sed 's#/$##' || true)
          sat_json=$(printf '%s\n' $sats | sed '/^$/d' | jq -R . | jq -cs .)
          audit_json=$(printf '%s\n' nexacore-api nexacore-dashboard $sats | sed '/^$/d' | jq -R . | jq -cs .)
          echo "satellites=$sat_json" >> "$GITHUB_OUTPUT"
          echo "audit-packages=$audit_json" >> "$GITHUB_OUTPUT"
          echo "satellites: $sat_json"; echo "audit-packages: $audit_json"

  dependency-audit:
    name: "Layer 2: Dependency Audit"
    runs-on: self-hosted
    needs: [discover-satellites]
    strategy:
      # SCRUM-370: ensure both api and dashboard always run independently.
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover-satellites.outputs.audit-packages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies (clean)
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: npm audit (all dependencies)
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=high

      - name: npm audit (production only)
        working-directory: ${{ matrix.package }}
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check for outdated dependencies
        working-directory: ${{ matrix.package }}
        run: npm outdated || true

      - name: Verify lock file integrity
        working-directory: ${{ matrix.package }}
        run: |
          # Ensure no file: or git: protocol dependencies (supply chain risk)
          if grep -E '"(file|git|git\+ssh|git\+https):' package-lock.json; then
            echo "::error::Supply chain risk: file: or git: protocol dependency detected"
            exit 1
          fi

      - name: Verify integrity hashes
        working-directory: ${{ matrix.package }}
        # ECO-125: the logic lives in a tested script that TOLERATES optional platform deps without a hash
        # (e.g. @tailwindcss/oxide-wasm32-wasi/* on linux) and stays strict for normal deps.
        run: node "$GITHUB_WORKSPACE/.github/scripts/check-lockfile-integrity.mjs" package-lock.json

  # ==========================================================================
  # Layer 3: Static Analysis (ESLint + Security Plugin) — per-package
  # Standard: CWE-89, CWE-79, CWE-1333, OWASP A03:2021
  # ==========================================================================
  sast-backend:
    name: "Layer 3: SAST (Backend)"
    runs-on: self-hosted
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: nexacore-api/package-lock.json

      - name: Install dependencies
        working-directory: nexacore-api
        run: npm ci

      - name: Generate Prisma client
        working-directory: nexacore-api
        run: npx prisma generate

      - name: Run ESLint (with security plugin)
        working-directory: nexacore-api
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings 0

      - name: Check for dangerous patterns
        working-directory: nexacore-api
        run: |
          echo "=== Checking for eval/Function constructor ==="
          if grep -rn "eval(" src/ --include="*.ts" | grep -v "node_modules" | grep -v ".spec.ts"; then
            echo "::error::eval() usage detected in production code"
            exit 1
          fi

          echo "=== Checking for child_process ==="
          if grep -rn "child_process\|execSync\|spawnSync" src/ --include="*.ts" | grep -v "node_modules" | grep -v ".spec.ts"; then
            echo "::error::child_process usage detected — potential command injection"
            exit 1
          fi

          echo "=== Checking for __proto__ / constructor.prototype ==="
          if grep -rn "__proto__\|constructor\[" src/ --include="*.ts" | grep -v "node_modules" | grep -v ".spec.ts"; then
            echo "::error::Prototype pollution pattern detected"
            exit 1
          fi

          echo "=== Checking for console.log in production ==="
          if grep -rn "console\.log\|console\.debug" src/ --include="*.ts" | grep -v "node_modules" | grep -v ".spec.ts" | grep -v "main.ts"; then
            echo "::warning::console.log detected in production code"
          fi

          echo "All dangerous pattern checks passed"

  sast-frontend:
    name: "Layer 3: SAST (Frontend)"
    runs-on: self-hosted
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: nexacore-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: nexacore-dashboard
        run: npm ci

      - name: Run ESLint
        working-directory: nexacore-dashboard
        # Next 16 removed `next lint` — use eslint directly with the flat config (SCRUM-364).
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings 0

      # ECO-126: prettier in CI for the dashboard. The API already validates formatting via eslint-plugin-prettier
      # (SAST Backend), but the dashboard eslint does NOT include it → formatting was only checked by the LOCAL
      # pre-push, which Dependabot doesn't run. A prettier bump (or manual drift) passed all of CI uncaught.
      # Same command as pre-commit/pre-push (package.json lint-staged) → a single source of the norm.
      - name: Check formatting (Prettier)
        working-directory: nexacore-dashboard
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Check for dangerous frontend patterns
        working-directory: nexacore-dashboard
        run: |
          echo "=== Checking for dangerouslySetInnerHTML ==="
          # dangerouslySetInnerHTML is XSS-prone and forbidden by default.
          # Path-based allowlist for legitimate uses (each entry must have
          # a SECURITY-ALLOW comment in-file documenting the rationale):
          #
          #   src/app/layout.tsx — SSR theme-flash prevention with static
          #     THEME_INIT_SCRIPT (build-time constant, never user-controlled),
          #     CSP nonce-protected. Required pre-hydration to avoid FOUC.
          #     Reviewed 2026-05-07.
          if grep -rn "dangerouslySetInnerHTML" src/ --include="*.tsx" --include="*.ts" \
              | grep -v "^src/app/layout.tsx:"; then
            echo "::error::dangerouslySetInnerHTML detected outside allowlist — XSS risk"
            exit 1
          fi

          echo "=== Checking for localStorage secrets ==="
          if grep -rn "localStorage\.setItem.*token\|localStorage\.setItem.*password\|localStorage\.setItem.*secret" src/ --include="*.ts" --include="*.tsx"; then
            echo "::error::Sensitive data in localStorage detected"
            exit 1
          fi

          echo "All frontend pattern checks passed"

  # ==========================================================================
  # Gate self-tests — validates the .github/scripts gate logic (ECO-125)
  # ==========================================================================
  gate-selftests:
    name: "Gate self-tests"
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run .github/scripts tests
        run: node --test .github/scripts/*.test.mjs

  # ==========================================================================
  # Single REQUIRED check. Always runs; a package whose SAST was SKIPPED
  # (unchanged) counts as pass — only a real failure/cancelled fails the gate.
  # ==========================================================================
  security-gate:
    name: "Security Gate (All Checks)"
    runs-on: self-hosted
    needs:
      [
        secrets-scan,
        dependency-audit,
        sast-backend,
        sast-frontend,
        gate-selftests,
      ]
    if: always()
    steps:
      - name: Aggregate results
        run: |
          fail=0
          for pair in \
            "secrets-scan:${{ needs.secrets-scan.result }}" \
            "dependency-audit:${{ needs.dependency-audit.result }}" \
            "sast-backend:${{ needs.sast-backend.result }}" \
            "sast-frontend:${{ needs.sast-frontend.result }}" \
            "gate-selftests:${{ needs.gate-selftests.result }}" ; do
            job="${pair%%:*}"; res="${pair#*:}"
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "::error::$job = $res"; fail=1
            else
              echo "  $job = $res (ok)"
            fi
          done
          [ "$fail" -eq 0 ] && echo "All security gates passed" || exit 1
