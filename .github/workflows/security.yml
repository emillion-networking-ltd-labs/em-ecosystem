# ============================================================================
# EM NexaCore — Security CI Pipeline
# ============================================================================
# Runs on every push and PR to main/develop branches.
# 5 layers: Secrets Detection, Dependency Audit, SAST, Tests, Build
# Standards: OWASP A06:2021, NIST SA-11, SOC 2 CC8.2, CWE-798
# ============================================================================

name: Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: '22'

jobs:
  # ==========================================================================
  # Layer 1: Secrets Detection (Gitleaks)
  # Standard: CWE-798 (Hard-coded Credentials), OWASP A07:2021
  # ==========================================================================
  secrets-scan:
    name: 'Layer 1: Secrets Detection'
    runs-on: ubuntu-latest
    # Se corre el BINARIO de gitleaks (open-source, gratis), NO el action wrapper: gitleaks-action@v2
    # introdujo enforcement de licencia de pago para ORGANIZACIONES (secret GITLEAKS_LICENSE) y, al faltar,
    # abortaba con "missing gitleaks license" ANTES de escanear — dejando en rojo este job y el Security Gate
    # en CADA PR de la org (ECO-94). El binario hace el mismo escaneo sin licencia. Ya no postea comentario de
    # PR, así que basta contents:read (antes pull-requests:write era para ese comentario del action — ECO-6).
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Escanea SOLO el rango introducido por el PR/push (lo que hacía el action), con el binario + .gitleaks.toml.
      # Así caza secretos NUEVOS sin re-escanear todo el historial: ni ahoga el gate con placeholders viejos de
      # docs ni necesita licencia. fetch-depth: 0 da el rango base..head completo.
      - name: Run Gitleaks (binario fijado — sin licencia de org)
        env:
          GL_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GL_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          VERSION="8.18.4"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          ZERO="0000000000000000000000000000000000000000"
          if [ -n "${GL_BASE:-}" ] && [ "$GL_BASE" != "$ZERO" ] && git cat-file -e "${GL_BASE}^{commit}" 2>/dev/null; then
            echo "Escaneando rango ${GL_BASE}..${GL_HEAD}"
            /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose \
              --exit-code 1 --log-opts="--no-merges ${GL_BASE}..${GL_HEAD}"
          else
            echo "Sin base válida (rama nueva / primer push): escaneo del último commit"
            /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose \
              --exit-code 1 --log-opts="--no-merges -1"
          fi

  # ==========================================================================
  # Layer 2: Dependency Audit
  # Standard: OWASP A06:2021 (Vulnerable Components), NIST SA-11
  # ==========================================================================
  # ECO-27 (F3a): descubre satélites por glob para que entren a los gates SIN editar el workflow.
  # audit-packages = api + dashboard + satellites/sat-* (siempre no vacía); satellites puede ser
  # vacía → los jobs por-satélite hacen skip limpio.
  discover-satellites:
    name: 'Discover satellites'
    runs-on: ubuntu-latest
    outputs:
      audit-packages: ${{ steps.find.outputs.audit-packages }}
      satellites: ${{ steps.find.outputs.satellites }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - id: find
        run: |
          sats=$(ls -d satellites/sat-*/ 2>/dev/null | sed 's#/$##' || true)
          sat_json=$(printf '%s\n' $sats | sed '/^$/d' | jq -R . | jq -cs .)
          audit_json=$(printf '%s\n' nexacore-api nexacore-dashboard $sats | sed '/^$/d' | jq -R . | jq -cs .)
          echo "satellites=$sat_json" >> "$GITHUB_OUTPUT"
          echo "audit-packages=$audit_json" >> "$GITHUB_OUTPUT"
          echo "satellites: $sat_json"; echo "audit-packages: $audit_json"

  dependency-audit:
    name: 'Layer 2: Dependency Audit'
    runs-on: ubuntu-latest
    needs: [discover-satellites]
    strategy:
      # SCRUM-370: ensure both api and dashboard always run independently.
      # Default fail-fast: true cancels siblings on first failure, costing
      # visibility (e.g. cannot tell if api is passing while debugging
      # dashboard). With fail-fast: false, every CI run reports both
      # outcomes — essential for incremental triage.
      fail-fast: false
      # ECO-27: matrix dinámica = api + dashboard + satélites descubiertos (auto-discover).
      matrix:
        package: ${{ fromJSON(needs.discover-satellites.outputs.audit-packages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies (clean)
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: npm audit (all dependencies)
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=high

      - name: npm audit (production only)
        working-directory: ${{ matrix.package }}
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check for outdated dependencies
        working-directory: ${{ matrix.package }}
        run: npm outdated || true

      - name: Verify lock file integrity
        working-directory: ${{ matrix.package }}
        run: |
          # Ensure no file: or git: protocol dependencies (supply chain risk)
          if grep -E '"(file|git|git\+ssh|git\+https):' package-lock.json; then
            echo "::error::Supply chain risk: file: or git: protocol dependency detected"
            exit 1
          fi

      - name: Verify integrity hashes
        working-directory: ${{ matrix.package }}
        # ECO-125: la lógica vive en un script testeado que TOLERA deps opcionales de plataforma sin hash
        # (p.ej. @tailwindcss/oxide-wasm32-wasi/* en linux) y sigue estricto para las deps normales.
        run: node "$GITHUB_WORKSPACE/.github/scripts/check-lockfile-integrity.mjs" package-lock.json

  # ==========================================================================
  # Layer 3: Static Analysis (ESLint + Security Plugin)
  # Standard: CWE-89, CWE-79, CWE-1333, OWASP A03:2021
  # ==========================================================================
  sast-backend:
    name: 'Layer 3: SAST (Backend)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nexacore-api/package-lock.json

      - name: Install dependencies
        working-directory: nexacore-api
        run: npm ci

      - name: Generate Prisma client
        working-directory: nexacore-api
        run: npx prisma generate

      - name: Run ESLint (with security plugin)
        working-directory: nexacore-api
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings 0

      - name: Check for dangerous patterns
        working-directory: nexacore-api
        run: |
          echo "=== Checking for eval/Function constructor ==="
          if grep -rn "eval(" src/ --include="*.ts" | grep -v "node_modules" | grep -v ".spec.ts"; then
            echo "::error::eval() usage detected in production code"
            exit 1
          fi

          echo "=== Checking for child_process ==="
          if grep -rn "child_process\|execSync\|spawnSync" src/ --include="*.ts" | grep -v "node_modules" | grep -v ".spec.ts"; then
            echo "::error::child_process usage detected — potential command injection"
            exit 1
          fi

          echo "=== Checking for __proto__ / constructor.prototype ==="
          if grep -rn "__proto__\|constructor\[" src/ --include="*.ts" | grep -v "node_modules" | grep -v ".spec.ts"; then
            echo "::error::Prototype pollution pattern detected"
            exit 1
          fi

          echo "=== Checking for console.log in production ==="
          if grep -rn "console\.log\|console\.debug" src/ --include="*.ts" | grep -v "node_modules" | grep -v ".spec.ts" | grep -v "main.ts"; then
            echo "::warning::console.log detected in production code"
          fi

          echo "All dangerous pattern checks passed"

  sast-frontend:
    name: 'Layer 3: SAST (Frontend)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nexacore-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: nexacore-dashboard
        run: npm ci

      - name: Run ESLint
        working-directory: nexacore-dashboard
        # Next 16 removed `next lint` — use eslint directly with the flat config (SCRUM-364).
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings 0

      - name: Check for dangerous frontend patterns
        working-directory: nexacore-dashboard
        run: |
          echo "=== Checking for dangerouslySetInnerHTML ==="
          # dangerouslySetInnerHTML is XSS-prone and forbidden by default.
          # Path-based allowlist for legitimate uses (each entry must have
          # a SECURITY-ALLOW comment in-file documenting the rationale):
          #
          #   src/app/layout.tsx — SSR theme-flash prevention with static
          #     THEME_INIT_SCRIPT (build-time constant, never user-controlled),
          #     CSP nonce-protected. Required pre-hydration to avoid FOUC.
          #     Reviewed 2026-05-07.
          if grep -rn "dangerouslySetInnerHTML" src/ --include="*.tsx" --include="*.ts" \
              | grep -v "^src/app/layout.tsx:"; then
            echo "::error::dangerouslySetInnerHTML detected outside allowlist — XSS risk"
            exit 1
          fi

          echo "=== Checking for localStorage secrets ==="
          if grep -rn "localStorage\.setItem.*token\|localStorage\.setItem.*password\|localStorage\.setItem.*secret" src/ --include="*.ts" --include="*.tsx"; then
            echo "::error::Sensitive data in localStorage detected"
            exit 1
          fi

          echo "All frontend pattern checks passed"

  # ==========================================================================
  # Layer 4: Tests + Coverage Gates
  # Standard: ISO 25010 (Reliability), SOC 2 CC8.3
  # ==========================================================================
  tests-backend:
    name: 'Layer 4: Tests (Backend)'
    runs-on: ubuntu-latest
    needs: [sast-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nexacore-api/package-lock.json

      - name: Install dependencies
        working-directory: nexacore-api
        run: npm ci

      - name: Generate Prisma client
        working-directory: nexacore-api
        run: npx prisma generate

      - name: Run tests with coverage
        working-directory: nexacore-api
        run: npm run test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: nexacore-api/coverage/
          retention-days: 30

  tests-frontend:
    name: 'Layer 4: Tests (Frontend)'
    runs-on: ubuntu-latest
    needs: [sast-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nexacore-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: nexacore-dashboard
        run: npm ci

      - name: Run tests with coverage
        working-directory: nexacore-dashboard
        run: npm run test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: nexacore-dashboard/coverage/
          retention-days: 30

  # ==========================================================================
  # Layer 5: Build Verification
  # Standard: SOC 2 CC8.2 (Change Management)
  # ==========================================================================
  build-backend:
    name: 'Layer 5: Build (Backend)'
    runs-on: ubuntu-latest
    needs: [tests-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nexacore-api/package-lock.json

      - name: Install dependencies
        working-directory: nexacore-api
        run: npm ci

      - name: Generate Prisma client
        working-directory: nexacore-api
        run: npx prisma generate

      - name: Build
        working-directory: nexacore-api
        run: npm run build

      - name: Verify dist output
        working-directory: nexacore-api
        run: |
          if [ ! -f dist/main.js ]; then
            echo "::error::Build output missing dist/main.js"
            exit 1
          fi
          echo "Build verification passed"

  build-frontend:
    name: 'Layer 5: Build (Frontend)'
    runs-on: ubuntu-latest
    needs: [tests-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nexacore-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: nexacore-dashboard
        run: npm ci

      - name: Build
        working-directory: nexacore-dashboard
        run: npm run build

  # ==========================================================================
  # Pipeline Summary
  # ==========================================================================
  # ECO-125: self-test de la lógica de los gates que vive en .github/scripts (p.ej. el check de integrity
  # que tolera deps opcionales). Así un cambio que rompa esa lógica se caza aquí.
  gate-selftests:
    name: 'Gate self-tests'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run .github/scripts tests
        run: node --test .github/scripts/*.test.mjs

  security-gate:
    name: 'Security Gate (All Checks)'
    runs-on: ubuntu-latest
    needs: [secrets-scan, dependency-audit, build-backend, build-frontend, gate-selftests]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.secrets-scan.result }}" != "success" ]; then
            echo "::error::Secrets scan failed"
            exit 1
          fi
          if [ "${{ needs.gate-selftests.result }}" != "success" ]; then
            echo "::error::Gate self-tests failed"
            exit 1
          fi
          if [ "${{ needs.dependency-audit.result }}" != "success" ]; then
            echo "::error::Dependency audit failed"
            exit 1
          fi
          if [ "${{ needs.build-backend.result }}" != "success" ]; then
            echo "::error::Backend build failed"
            exit 1
          fi
          if [ "${{ needs.build-frontend.result }}" != "success" ]; then
            echo "::error::Frontend build failed"
            exit 1
          fi
          echo "All security gates passed"
