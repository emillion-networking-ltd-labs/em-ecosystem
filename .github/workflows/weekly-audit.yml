# ============================================================================
# EM NexaCore — Weekly Security Audit
# ============================================================================
# Scheduled every Monday at 06:00 UTC. Can also be triggered manually.
# Full dependency audit + license compliance + outdated check.
# Standards: OWASP A06:2021, NIST SA-11, SOC 2 CC7.1
# ============================================================================

name: Weekly Security Audit

on:
  schedule:
    # Daily, not weekly: a freshly published advisory should surface within a day. The PR-level
    # audit only runs when a dependency manifest changes, so this is what catches an advisory that
    # appears without anyone touching the code.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '22'

jobs:
  # ==========================================================================
  # Full Dependency Audit (both packages)
  # ==========================================================================
  full-dependency-audit:
    name: 'Full Dependency Audit'
    runs-on: self-hosted
    strategy:
      matrix:
        package: [nexacore-api, nexacore-dashboard]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Full npm audit (JSON output)
        id: audit
        working-directory: ${{ matrix.package }}
        run: |
          echo "=== All Dependencies ==="
          npm audit --json > audit-all.json 2>&1 || true
          # Writes a human-readable advisory list to summary.md so the tracking issue can name what
          # is wrong, then fails the step when anything critical/high is present.
          set +e
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('audit-all.json','utf8'));
            const v = data.metadata?.vulnerabilities || {};
            for (const k of ['critical','high','moderate','low','info']) {
              console.log(k[0].toUpperCase()+k.slice(1)+':', v[k] || 0);
            }
            const bad = Object.entries(data.vulnerabilities || {})
              .filter(([, x]) => ['critical','high'].includes(x.severity));
            const lines = bad.map(([name, x]) => {
              const via = (x.via || []).find((y) => typeof y === 'object');
              const fix = x.fixAvailable === false ? 'no fix available'
                        : (typeof x.fixAvailable === 'object'
                           ? \`fix: \${x.fixAvailable.name}@\${x.fixAvailable.version}\${x.fixAvailable.isSemVerMajor ? ' (MAJOR)' : ''}\`
                           : 'fix available');
              return \`- **\${name}** [\${x.severity}] — \${via?.title || 'see advisory'}\${via?.url ? ' (' + via.url + ')' : ''} — \${fix}\`;
            });
            fs.writeFileSync('summary.md', lines.join('\n') + '\n');
            process.exit((v.critical || 0) > 0 || (v.high || 0) > 0 ? 1 : 0);
          "
          code=$?
          set -e
          echo "vulnerable=$([ "$code" -ne 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Open or update tracking issue on vulnerabilities
        if: failure() && steps.audit.outputs.vulnerable == 'true'
        working-directory: ${{ matrix.package }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          title="[security] critical/high vulnerabilities in dependencies ($today)"
          body="## Vulnerabilidades en \`${{ matrix.package }}\`\n\nLa auditoría diaria encontró dependencias con severidad critical/high:\n\n$(cat summary.md)\n\n## Qué hacer\n\nFijar la versión parcheada (override si es transitiva), verificar build + tests, y añadir un guard de versión. Si no hay parche upstream, anotarlo aquí y vigilar.\n\n## Por qué llega como issue\n\nEl audit a nivel de PR solo corre cuando cambia un manifiesto de dependencias — un PR que no las toca no puede introducir una vulnerabilidad. Un advisory nuevo aparece sin que nadie toque el código, así que lo caza esta auditoría diaria y lo convierte en tarea con dueño en vez de un rojo silencioso.\n"
          existing=$(gh issue list --state open --search "in:title [security] critical/high vulnerabilities" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            printf "%b" "$body" | gh issue comment "$existing" --body-file -
          else
            printf "%b" "$body" | gh issue create --title "$title" --label "tech-debt" --body-file -
          fi

      - name: Production-only audit
        working-directory: ${{ matrix.package }}
        run: |
          echo "=== Production Dependencies Only ==="
          npm audit --omit=dev --json > audit-prod.json 2>&1 || true
          cat audit-prod.json | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const v = data.metadata?.vulnerabilities || {};
            console.log('Critical:', v.critical || 0);
            console.log('High:', v.high || 0);
            if ((v.critical || 0) > 0) process.exit(1);
          "

      - name: Check outdated packages
        working-directory: ${{ matrix.package }}
        run: |
          echo "=== Outdated Packages ==="
          npm outdated --json > outdated.json 2>&1 || true
          node -e "
            const data = JSON.parse(require('fs').readFileSync('outdated.json','utf8'));
            const entries = Object.entries(data);
            console.log('Total outdated:', entries.length);
            const major = entries.filter(([,v]) => {
              const curr = (v.current || '').split('.')[0];
              const latest = (v.latest || '').split('.')[0];
              return curr !== latest;
            });
            if (major.length > 0) {
              console.log('Major version behind (' + major.length + '):');
              major.forEach(([name, v]) => console.log('  ' + name + ': ' + v.current + ' → ' + v.latest));
              console.log('::warning::' + major.length + ' packages are a major version behind');
            }
          "

      - name: License compliance check
        working-directory: ${{ matrix.package }}
        run: |
          echo "=== License Compliance ==="
          npx license-checker --production --failOn "GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;SSPL-1.0;EUPL-1.1;EUPL-1.2" --summary || {
            echo "::error::Copyleft license detected in production dependencies"
            exit 1
          }

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-reports-${{ matrix.package }}
          path: |
            ${{ matrix.package }}/audit-all.json
            ${{ matrix.package }}/audit-prod.json
            ${{ matrix.package }}/outdated.json
          retention-days: 90

  # ==========================================================================
  # Supply Chain Integrity Check
  # ==========================================================================
  supply-chain:
    name: 'Supply Chain Integrity'
    runs-on: self-hosted
    strategy:
      matrix:
        package: [nexacore-api, nexacore-dashboard]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify lock file integrity
        working-directory: ${{ matrix.package }}
        run: |
          # Check for file:/git: protocol (supply chain attack vector)
          if grep -E '"(file|git|git\+ssh|git\+https):' package-lock.json; then
            echo "::error::Supply chain risk: non-registry dependency protocol detected"
            exit 1
          fi
          echo "Lock file protocol check passed"

      - name: Check for duplicate packages
        working-directory: ${{ matrix.package }}
        run: |
          npx npm-dedupe-check 2>/dev/null || {
            echo "Checking for duplicates manually..."
            node -e "
              const lock = require('./package-lock.json');
              const seen = {};
              for (const [path, info] of Object.entries(lock.packages || {})) {
                const name = path.replace(/^node_modules\//, '').replace(/.*node_modules\//, '');
                if (!name || name.startsWith('.')) continue;
                if (!seen[name]) seen[name] = [];
                seen[name].push(info.version);
              }
              const dupes = Object.entries(seen).filter(([,v]) => new Set(v).size > 1);
              if (dupes.length > 0) {
                console.log('Packages with multiple versions (' + dupes.length + '):');
                dupes.slice(0, 20).forEach(([name, versions]) => {
                  console.log('  ' + name + ': ' + [...new Set(versions)].join(', '));
                });
                if (dupes.length > 10) console.log('::warning::' + dupes.length + ' duplicate packages detected');
              } else {
                console.log('No duplicate packages found');
              }
            "
          }

  # ==========================================================================
  # Branch Hygiene Audit
  # Lists feature/fix branches whose tip is reachable from main and were last
  # updated >7 days ago. With delete_branch_on_merge=true these should not
  # exist; this job is defence-in-depth for cases where the setting was
  # disabled or branches were created outside the PR flow.
  # Standards: Required Repository Configuration C
  # ==========================================================================
  branch-audit:
    name: 'Branch Hygiene Audit'
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find merged stale branches
        id: find_stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --prune origin

          stale_count=0
          stale_list=""
          cutoff=$(date -u -d '7 days ago' +%s)

          # Iterate every remote branch except main / dependabot/*
          while IFS= read -r branch; do
            short="${branch#origin/}"
            [ "$short" = "main" ] && continue
            case "$short" in dependabot/*) continue ;; esac

            # Is it merged into main?
            if ! git merge-base --is-ancestor "$branch" origin/main 2>/dev/null; then
              continue
            fi

            # Last update time of the branch tip (UTC seconds)
            last_update=$(git log -1 --format=%ct "$branch" 2>/dev/null || echo "0")
            [ "$last_update" -ge "$cutoff" ] && continue

            stale_count=$((stale_count + 1))
            iso=$(date -u -d "@$last_update" +%Y-%m-%d 2>/dev/null || echo "?")
            stale_list="${stale_list}- \`${short}\` — last updated ${iso}\n"
          done < <(git branch -r | sed 's/^[[:space:]]*//' | grep '^origin/' || true)

          echo "stale_count=${stale_count}" >> "$GITHUB_OUTPUT"
          # Save list to file (multi-line outputs in GHA are awkward via $GITHUB_OUTPUT)
          printf "%b" "$stale_list" > stale-branches.md

          echo "Stale merged branches found: ${stale_count}"
          if [ "$stale_count" -gt 0 ]; then
            echo ""
            echo "List:"
            printf "%b" "$stale_list"
          fi

      - name: Open or update tracking issue
        if: steps.find_stale.outputs.stale_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          title="[branch-audit] $(cat stale-branches.md | wc -l | tr -d ' ') stale merged branches detected ($today)"
          body="## Stale merged branches\n\nThe weekly branch-audit found branches that are reachable from \`main\` but whose tip has not been updated in over 7 days. With \`delete_branch_on_merge=true\` enabled at the repo level, these should not exist.\n\n$(cat stale-branches.md)\n\n## How to fix\n\nFor each branch above:\n\n\`\`\`bash\ngh api -X DELETE repos/\${GITHUB_REPOSITORY}/git/refs/heads/<branch-name>\n\`\`\`\n\nIf many appear simultaneously, also re-verify the repo setting:\n\n\`\`\`bash\ngh api repos/\${GITHUB_REPOSITORY} --jq .delete_branch_on_merge\n\`\`\`\n\nMust return \`true\`. If \`false\`, re-apply Required Repository Configuration A.\n\n## References\n\n- Required Repository Configuration (§2)\n- Case Study: SCRUM-359 Incident (§2)\n"

          # Look for an existing open issue with this title pattern (last 30 days)
          existing=$(gh issue list --state open --search "in:title [branch-audit]" --json number,title --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Updating existing issue #$existing"
            printf "%b" "$body" | gh issue comment "$existing" --body-file -
          else
            echo "Opening new issue: $title"
            printf "%b" "$body" | gh issue create --title "$title" --label "tech-debt,branch-audit" --body-file -
          fi

      - name: All clean
        if: steps.find_stale.outputs.stale_count == '0'
        run: echo "No stale merged branches found. Repo hygiene OK."

  # ==========================================================================
  # Branch Protection Drift Audit (ECO-126)
  # Verifica que la branch protection de main sigue exigiendo los required checks
  # correctos (Security Gate + code-health + Dashboard VRT) y strict:true. La deriva de
  # esta config (Security Gate NO-required) fue lo que dejó auto-mergear los bumps
  # rotos #515/#516. Leer la protección necesita permiso ADMIN → si el runner solo
  # tiene GITHUB_TOKEN el script sale 2 (warn, no rojo); define el secret ADMIN_TOKEN
  # (PAT con admin:repo) para que la guardia sea EXIGENTE.
  # ==========================================================================
  branch-protection-audit:
    name: 'Branch Protection Audit'
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check branch protection drift
        id: drift
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          out=$(node .github/scripts/check-branch-protection.mjs 2>&1); code=$?
          printf '%s\n' "$out"
          printf '%s\n' "$out" > drift.md
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          # 2 = no se pudo leer la protección (runner sin admin) → warn, no romper el audit.
          [ "$code" = "2" ] && exit 0
          exit "$code"

      - name: Open or update tracking issue on drift
        if: failure() && steps.drift.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          title="[branch-protection] main protection has drifted ($today)"
          body="## Branch protection drift\n\nLa guardia anti-deriva (ECO-126) detectó que la branch protection de \`main\` ya no coincide con el intent:\n\n\`\`\`\n$(cat drift.md)\n\`\`\`\n\nReaplica la config con el comando que imprime el script (necesita admin).\n\n## Referencias\n- ADR-021 (política de required checks)\n- \`.github/scripts/check-branch-protection.mjs\`\n"
          existing=$(gh issue list --state open --search "in:title [branch-protection]" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            printf "%b" "$body" | gh issue comment "$existing" --body-file -
          else
            printf "%b" "$body" | gh issue create --title "$title" --label "tech-debt" --body-file -
          fi

  # ==========================================================================
  # Weekly Summary Report
  # ==========================================================================
  summary:
    name: 'Weekly Summary'
    runs-on: self-hosted
    needs: [full-dependency-audit, supply-chain, branch-audit, branch-protection-audit]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Weekly Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "**Node.js**: ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.full-dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Supply Chain | ${{ needs.supply-chain.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch Hygiene | ${{ needs.branch-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch Protection | ${{ needs.branch-protection-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Standards: OWASP A06:2021, NIST SA-11, SOC 2 CC7.1" >> $GITHUB_STEP_SUMMARY
