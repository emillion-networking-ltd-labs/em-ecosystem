# ============================================================================
# EM NexaCore — Weekly Security Audit
# ============================================================================
# Scheduled every Monday at 06:00 UTC. Can also be triggered manually.
# Full dependency audit + license compliance + outdated check.
# Standards: OWASP A06:2021, NIST SA-11, SOC 2 CC7.1
# ============================================================================

name: Weekly Security Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '22'

jobs:
  # ==========================================================================
  # Full Dependency Audit (both packages)
  # ==========================================================================
  full-dependency-audit:
    name: 'Full Dependency Audit'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [nexacore-api, nexacore-dashboard]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Full npm audit (JSON output)
        working-directory: ${{ matrix.package }}
        run: |
          echo "=== All Dependencies ==="
          npm audit --json > audit-all.json 2>&1 || true
          cat audit-all.json | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const v = data.metadata?.vulnerabilities || {};
            console.log('Critical:', v.critical || 0);
            console.log('High:', v.high || 0);
            console.log('Moderate:', v.moderate || 0);
            console.log('Low:', v.low || 0);
            console.log('Info:', v.info || 0);
            if ((v.critical || 0) > 0 || (v.high || 0) > 0) process.exit(1);
          "

      - name: Production-only audit
        working-directory: ${{ matrix.package }}
        run: |
          echo "=== Production Dependencies Only ==="
          npm audit --omit=dev --json > audit-prod.json 2>&1 || true
          cat audit-prod.json | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const v = data.metadata?.vulnerabilities || {};
            console.log('Critical:', v.critical || 0);
            console.log('High:', v.high || 0);
            if ((v.critical || 0) > 0) process.exit(1);
          "

      - name: Check outdated packages
        working-directory: ${{ matrix.package }}
        run: |
          echo "=== Outdated Packages ==="
          npm outdated --json > outdated.json 2>&1 || true
          node -e "
            const data = JSON.parse(require('fs').readFileSync('outdated.json','utf8'));
            const entries = Object.entries(data);
            console.log('Total outdated:', entries.length);
            const major = entries.filter(([,v]) => {
              const curr = (v.current || '').split('.')[0];
              const latest = (v.latest || '').split('.')[0];
              return curr !== latest;
            });
            if (major.length > 0) {
              console.log('Major version behind (' + major.length + '):');
              major.forEach(([name, v]) => console.log('  ' + name + ': ' + v.current + ' → ' + v.latest));
              console.log('::warning::' + major.length + ' packages are a major version behind');
            }
          "

      - name: License compliance check
        working-directory: ${{ matrix.package }}
        run: |
          echo "=== License Compliance ==="
          npx license-checker --production --failOn "GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;SSPL-1.0;EUPL-1.1;EUPL-1.2" --summary || {
            echo "::error::Copyleft license detected in production dependencies"
            exit 1
          }

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-reports-${{ matrix.package }}
          path: |
            ${{ matrix.package }}/audit-all.json
            ${{ matrix.package }}/audit-prod.json
            ${{ matrix.package }}/outdated.json
          retention-days: 90

  # ==========================================================================
  # Supply Chain Integrity Check
  # ==========================================================================
  supply-chain:
    name: 'Supply Chain Integrity'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [nexacore-api, nexacore-dashboard]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify lock file integrity
        working-directory: ${{ matrix.package }}
        run: |
          # Check for file:/git: protocol (supply chain attack vector)
          if grep -E '"(file|git|git\+ssh|git\+https):' package-lock.json; then
            echo "::error::Supply chain risk: non-registry dependency protocol detected"
            exit 1
          fi
          echo "Lock file protocol check passed"

      - name: Check for duplicate packages
        working-directory: ${{ matrix.package }}
        run: |
          npx npm-dedupe-check 2>/dev/null || {
            echo "Checking for duplicates manually..."
            node -e "
              const lock = require('./package-lock.json');
              const seen = {};
              for (const [path, info] of Object.entries(lock.packages || {})) {
                const name = path.replace(/^node_modules\//, '').replace(/.*node_modules\//, '');
                if (!name || name.startsWith('.')) continue;
                if (!seen[name]) seen[name] = [];
                seen[name].push(info.version);
              }
              const dupes = Object.entries(seen).filter(([,v]) => new Set(v).size > 1);
              if (dupes.length > 0) {
                console.log('Packages with multiple versions (' + dupes.length + '):');
                dupes.slice(0, 20).forEach(([name, versions]) => {
                  console.log('  ' + name + ': ' + [...new Set(versions)].join(', '));
                });
                if (dupes.length > 10) console.log('::warning::' + dupes.length + ' duplicate packages detected');
              } else {
                console.log('No duplicate packages found');
              }
            "
          }

  # ==========================================================================
  # Weekly Summary Report
  # ==========================================================================
  summary:
    name: 'Weekly Summary'
    runs-on: ubuntu-latest
    needs: [full-dependency-audit, supply-chain]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Weekly Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "**Node.js**: ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.full-dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Supply Chain | ${{ needs.supply-chain.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Standards: OWASP A06:2021, NIST SA-11, SOC 2 CC7.1" >> $GITHUB_STEP_SUMMARY
