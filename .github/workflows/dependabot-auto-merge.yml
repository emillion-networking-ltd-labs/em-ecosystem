# Auto-merge de PRs de Dependabot en verde (ECO-33).
# Patrón documentado oficial de GitHub: on: pull_request (NO pull_request_target) + fetch-metadata,
# SIN checkout del código del PR → no se ejecuta código no confiable ni se exponen secrets.
# Solo patch/minor → auto-merge; majors → revisión humana (y dependabot.yml ya los ignora en rutina).
# `gh pr merge --auto` activa el merge AUTOMÁTICO que la branch protection dispara SOLO cuando los
# required checks (gates, Security Gate) pasan. Las PRs de SEGURIDAD también fluyen por esta vía.
name: Dependabot auto-merge

on: pull_request

# Permisos mínimos: la elevación aplica al GITHUB_TOKEN del evento de Dependabot.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Doble guarda: solo PRs abiertas por dependabot[bot].
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge (solo patch/minor; majors a mano)
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
