# ============================================================================
# em-ui governance — cadena `npm run governance` (drift + component-drift + manifest + fleet-report +
# conflict-markers + raw-color) sobre rutas de consumidor (ECO-144; +manifest E4a ECO-152; +fleet-report E4b ECO-155)
# ============================================================================
# Cierra la brecha del gate: los checks de gobernanza de em-ui (que la copia de cada consumidor es fiel a la
# fuente, que su manifest está completo/íntegro, y que ningún fichero lleva marcadores de conflicto) SOLO
# corrían en `design-system/**` (workflow del Storybook). Un PR que toca SOLO un consumidor (satélite/dashboard)
# no los ejecutaba → una copia stale, un manifest desincronizado o un merge a medias podía colarse. Este
# workflow corre la cadena `governance` completa TAMBIÉN sobre las rutas de consumidor y el manifest.
#
# Ligero: los gates son node stdlib puro (+ registry/_reconcile.mjs + registry/_manifest.mjs), sin deps → no
# hace `npm ci` ni build. Complementa (no reemplaza) al workflow del Storybook, que sigue corriendo la cadena
# `coverage` completa en cambios del DS.
# ============================================================================

name: em-ui governance

on:
  pull_request:
    branches: [main]
    paths:
      - "satellites/**"
      - "nexacore-dashboard/src/**"
      - "nexacore-api/src/**"
      - "**/em-ui.manifest.json"
      - "design-system/registry/**"
      - "design-system/scripts/check-drift.mjs"
      - "design-system/scripts/check-component-drift.mjs"
      - "design-system/scripts/check-manifest.mjs"
      - "design-system/scripts/check-fleet-report.mjs"
      - "design-system/scripts/check-conflict-markers.mjs"
      - ".github/workflows/em-ui-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  governance:
    name: em-ui governance (drift + conflict-markers)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR / branch
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: em-ui governance gates (npm run governance — drift + component-drift + manifest + conflict-markers + raw-color)
        working-directory: design-system
        run: npm run governance
