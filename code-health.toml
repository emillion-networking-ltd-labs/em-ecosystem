# code-health — declared checks for the emkeel `check_code_health` gate (ADR-034, strategy: code-health).
# Each check's command prints the CURRENT violation count (an integer, last line of stdout); the gate reads
# the baseline committed on the base branch and FAILS a PR whose count exceeds it. The baseline may only
# DECREASE (no big-bang on legacy debt). This file lives at the repo ROOT (not emkeel.toml, which `emkeel
# update` regenerates and the isolation guard blocks). The gate is DORMANT until this file declares a check.

[[check]]
# Code and code comments must be ENGLISH (D1). Reuses the design-system's existing scanner via a `--count`
# adapter; the DS's own internal ratchet is unchanged.
name = "comment-language"
command = "node design-system/scripts/check-comment-language.mjs --count"
baseline = 1060

# Fleet generalization (Piece 2, #668): the same rule (D1) across the rest of the fleet — one check per
# package, each with its own baseline. The shared `scripts/check-comment-language.mjs` reuses the DS detector
# and scans a target dir. Baselines are each package's real current count (ratchet: only decreases).
[[check]]
name = "comment-language-api"
command = "node scripts/check-comment-language.mjs --count nexacore-api/src"
baseline = 1

[[check]]
name = "comment-language-dashboard"
command = "node scripts/check-comment-language.mjs --count nexacore-dashboard/src"
baseline = 208

[[check]]
name = "comment-language-sat-cristian-garcia"
command = "node scripts/check-comment-language.mjs --count satellites/sat-cristian-garcia/src"
baseline = 382
