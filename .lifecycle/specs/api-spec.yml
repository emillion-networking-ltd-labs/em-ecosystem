openapi: 3.0.0
info:
  title: EM NexaCore API
  description: |
    REST API for the EM NexaCore platform by EMillion Networking LTD.

    This API implements a NestJS modular architecture with JWT + OAuth authentication,
    granular RBAC with permissions, and support for multi-project collaboration.

    ## Domain Areas
    - Authentication & Authorization (JWT, OAuth, RBAC)
    - User Management
    - Projects & Teams
    - Notifications
    - Billing & Subscriptions
    - Settings
    - Platform Modules
    - Applications
    - Permissions (RBAC)

    ## Features
    - User registration with email/password
    - JWT authentication with multi-device refresh tokens
    - OAuth 2.0 integration (Google, GitHub)
    - Role-based access control (USER, ADMIN, SUPERADMIN)
    - Granular permissions system
    - Project and team management with member roles
    - Real-time notification system
    - Stripe-ready billing integration
    - User and project settings
    - Modular feature management per project
    - Application lifecycle management

  version: 2.0.0
  contact:
    name: EMillion Networking Labs
  license:
    name: ISC

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Authentication
    description: Login, register, OAuth, token lifecycle
  - name: Auth v2
    description: AUTH v2 + Tenancy v1 program endpoints (SCRUM-486 / Phase 1.3+). v1 Authentication endpoints continue to serve production traffic in parallel during the strangler-pattern overlap.
  - name: Authorization
    description: Admin and permission-restricted endpoints
  - name: OAuth
    description: Google and GitHub OAuth flows
  - name: Users
    description: User profile and admin user management
  - name: Projects
    description: Project CRUD and member management
  - name: Teams
    description: Team CRUD and member management within projects
  - name: Notifications
    description: User notification management
  - name: Billing
    description: Subscriptions and invoices per project
  - name: Settings
    description: User, project, and system settings
  - name: Modules
    description: Platform module management per project
  - name: Apps
    description: Application management within projects
  - name: Sessions
    description: Active session management and token lifecycle
  - name: Trusted Devices
    description: MFA-trusted device management
  - name: MFA
    description: Multi-factor authentication (TOTP) setup and verification
  - name: Email Verification
    description: Email verification and password reset flows
  - name: Passkeys
    description: WebAuthn/passkey registration, authentication, and management
  - name: Audit Logs
    description: Security audit log access (ADMIN)
  - name: Permissions
    description: RBAC permission management (SUPERADMIN)
  - name: Tenants
    description: Multi-tenant invitation lifecycle + member listing (SCRUM-491 / AUTH v2 Phase 0.4)
  - name: Organizations
    description: Per-tenant Organization sub-grouping (SCRUM-495 / AUTH v2 Phase 2.1). Organizations live inside a Tenant; users may be members of multiple Organizations within the same Tenant.
  - name: Auth v2 — AuthIntent
    description: AUTH v2 + Tenancy v1 Phase 2.2 (SCRUM-497 / D-004). Server-side state machine replacing v1 procedural `executeLogin`. Two endpoints (`POST /auth/v2/intents` + `POST /auth/v2/intents/:id/advance`) behind feature flag `app.authIntentV2Enabled` (default off in production, on in CI/test). The intent IS the auth state — no `@UseGuards`. Terminal-state replay returns 410 Gone.

# ─── Paths ──────────────────────────────────────────────────

paths:

  # ─── Authentication ─────────────────────────────────────

  /auth/register:
    post:
      summary: Register a new user
      description: Processes registration request. Returns identical response for both new and existing emails (anti-enumeration per CWE-200/CWE-203, OWASP ASVS V2.1.1). Sends verification email for new accounts, notification email for existing accounts.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '200':
          description: Registration request processed. Response is identical regardless of whether the email exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Please check your email to continue"
                required: [message]
        '400':
          description: Validation error or breached password (HIBP check via k-anonymity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Too many registration attempts (5 per 60s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'

  /auth/login:
    post:
      summary: Login with email and password
      description: Authenticates a user and returns JWT tokens. A refresh token is created per device (max 5 concurrent sessions; oldest evicted when limit exceeded). Sessions idle for more than 30 minutes are rejected on next refresh. Account is locked after 5 failed attempts for 15 minutes. If `X-Device-Fingerprint` header is sent and the device is trusted, MFA challenge is skipped.
      tags: [Authentication]
      parameters:
        - in: header
          name: X-Device-Fingerprint
          required: false
          schema:
            type: string
            minLength: 16
            maxLength: 512
          description: Browser fingerprint (e.g. FingerprintJS visitorId). If the device is trusted, MFA is skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: >
            Login result. One of three discriminated responses:
            (1) `AuthResponse` — successful login with tokens and user profile.
            (2) `MfaChallengeResponse` — user has MFA enabled, must complete challenge via /auth/mfa/verify-login.
            (3) `MfaSetupRequiredResponse` — ADMIN/SUPERADMIN without MFA, must set up MFA first (OWASP ASVS V2.7.2).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
                  - $ref: '#/components/schemas/MfaSetupRequiredResponse'
        '401':
          description: >
            Invalid credentials. Returned for ALL login failures: non-existing email,
            wrong password, OAuth-only accounts (no password set), locked accounts
            (progressive lockout), and unverified email (SCRUM-217, CWE-203).
            All paths return the same generic message ("Invalid credentials") to prevent
            account state enumeration. The Retry-After HTTP header is set when the
            account is locked (lockout duration in seconds). Unverified accounts
            silently receive a re-verification email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Forbidden — impossible travel detected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many login attempts (10 per 60s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'

  /auth/refresh:
    post:
      summary: Refresh access token
      description: |
        Exchanges a valid refresh token for new access and refresh tokens. Implements token rotation — the old refresh token is invalidated.
        The refresh token is read from the `refresh_token` httpOnly cookie (not from the request body).
        Returns 401 if the session has been idle for longer than SESSION_IDLE_TIMEOUT_HOURS (default 0.5h / 30 min).
      tags: [Authentication]
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid, expired, or idle-timed-out refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many refresh attempts (30 per 60s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'

  /auth/v2/refresh:
    post:
      summary: Refresh v2 access token (cookie-based opaque refresh)
      description: |
        SCRUM-494 / AUTH v2 Phase 1.3 — first v2 production HTTP surface.

        Refreshes a v2 JWT access token using an opaque refresh token read from the httpOnly `refresh_token_v2` cookie (distinct from v1's `refresh_token`). Exercises `SessionsServiceV2.validateAndRotate` (atomic one-time-use rotation, Phase 1.2) and `TokenServiceV2.mintAccessToken` (Phase 1.1) end-to-end through `JwtV2Strategy`.

        Cookie posture mirrors v1: `httpOnly: true`, `secure` in production, `sameSite: 'strict'`, `path: '/'`, `maxAge` = refresh TTL. Response body contains the new access token + canonical user/tenant claims (no refresh token in body — cookie-only by design, XSS-resistant).

        **No-failure-mode-enumeration discipline**: all failures (missing cookie, invalid token, expired, revoked, membership-stale) return the same generic 401. The reason class lives only in audit metadata emitted by `SessionsServiceV2` internally.

        **Order-of-operations**: `validateAndRotate` commits atomically before `mintAccessToken` runs. If mint throws (e.g., misconfigured JWT secret), the rotation already committed → orphan rotation (rotated session still valid; client retries). Acceptable trade-off per program §2.4.

        **No `@UseGuards`** — the refresh token IS the authentication; access tokens may be expired by definition.
      tags: [Auth v2]
      responses:
        '200':
          description: Tokens refreshed; new access token in body, new refresh token set in httpOnly cookie
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, user]
                properties:
                  accessToken:
                    type: string
                    description: New v2 JWT access token (JwtPayloadV2 shape; 15-min TTL).
                  user:
                    type: object
                    required: [id, tenantId, tenantRole, isPlatformAdmin]
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: User id (matches JwtPayloadV2.sub).
                      tenantId:
                        type: string
                        format: uuid
                        description: Active tenant id for this session.
                      tenantRole:
                        type: string
                        enum: [OWNER, ADMIN, MEMBER, VIEWER, CUSTOM]
                        description: User's role within the active tenant.
                      isPlatformAdmin:
                        type: boolean
                        description: Cross-tenant platform-admin capability flag.
        '401':
          description: Missing cookie, invalid/expired/revoked refresh token, or stale membership — generic message (no failure-mode enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Too many refresh attempts (rate-limit matches v1''s /auth/refresh — 30 per 60s).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'

  /auth/logout:
    post:
      summary: Logout current user
      description: Invalidates the user's current refresh token (read from httpOnly cookie). Does not require authentication — works even if the JWT is expired, allowing locked-out users to log out.
      tags: [Authentication]
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/me:
    get:
      summary: Get current user profile
      description: Returns the authenticated user's profile. Requires valid JWT.
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeUser'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/admin:
    get:
      summary: Admin-only endpoint
      description: Returns a success message for users with ADMIN or SUPERADMIN role. Requires JWT + ADMIN role.
      tags: [Authorization]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admin access granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/google:
    get:
      summary: Initiate Google OAuth
      description: Redirects the user to Google's OAuth consent screen. Generates a single-use state parameter (UUID, 5min TTL) for CSRF protection and passes it to the OAuth provider.
      tags: [OAuth]
      responses:
        '302':
          description: Redirect to Google OAuth with state parameter

  /auth/google/callback:
    get:
      summary: Google OAuth callback
      description: Handles the Google OAuth callback. Validates the state parameter against OAuthStateStore (single-use, 5min TTL). Creates or links user account, generates an ephemeral authorization code (UUID, 60s TTL), sets it as an httpOnly cookie (oauth_code, 30s TTL, SameSite=strict, Secure in prod), and redirects to the frontend without code in URL. Validates redirect URL against OAUTH_ALLOWED_REDIRECT_URLS allowlist.
      tags: [OAuth]
      responses:
        '302':
          description: Redirect to frontend with ephemeral code in httpOnly cookie (oauth_code)

  /auth/github:
    get:
      summary: Initiate GitHub OAuth
      description: Redirects the user to GitHub's OAuth consent screen. Generates a single-use state parameter (UUID, 5min TTL) for CSRF protection and passes it to the OAuth provider.
      tags: [OAuth]
      responses:
        '302':
          description: Redirect to GitHub OAuth with state parameter

  /auth/github/callback:
    get:
      summary: GitHub OAuth callback
      description: Handles the GitHub OAuth callback. Validates the state parameter against OAuthStateStore (single-use, 5min TTL). Creates or links user account, generates an ephemeral authorization code (UUID, 60s TTL), sets it as an httpOnly cookie (oauth_code, 30s TTL, SameSite=strict, Secure in prod), and redirects to the frontend without code in URL. Validates redirect URL against OAUTH_ALLOWED_REDIRECT_URLS allowlist.
      tags: [OAuth]
      responses:
        '302':
          description: Redirect to frontend with ephemeral code in httpOnly cookie (oauth_code)

  /auth/link/code:
    post:
      summary: Generate short-lived code for OAuth account linking
      description: >-
        Returns a single-use, cryptographically random link code (64-char hex)
        valid for 60 seconds. The code is used in the subsequent
        GET /auth/link/{provider}?code= redirect to avoid passing JWTs in URLs
        (OWASP ASVS V8.3.1, RFC 6750 §2.3).
      tags: [OAuth]
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Link code generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: Short-lived, single-use link code (64-char hex)
        '401':
          description: Unauthorized — valid JWT required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/link/google:
    get:
      summary: Link Google account to authenticated user
      description: >-
        Requires a valid link code from POST /auth/link/code via ?code= query param.
        OAuthLinkGuard validates the code (single-use, 60s TTL) and sets oauthAction='link',
        then GoogleAuthGuard redirects to Google consent screen with
        action=link and userId embedded in the OAuth state parameter.
        On callback, the user's Google account is linked to their existing account.
      tags: [OAuth]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Short-lived link code from POST /auth/link/code
      responses:
        '302':
          description: Redirects to Google consent screen
        '401':
          description: Unauthorized — invalid or expired link code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/link/github:
    get:
      summary: Link GitHub account to authenticated user
      description: >-
        Requires a valid link code from POST /auth/link/code via ?code= query param.
        OAuthLinkGuard validates the code (single-use, 60s TTL) and sets oauthAction='link',
        then GitHubAuthGuard redirects to GitHub authorization screen with
        action=link and userId embedded in the OAuth state parameter.
        On callback, the user's GitHub account is linked to their existing account.
      tags: [OAuth]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Short-lived link code from POST /auth/link/code
      responses:
        '302':
          description: Redirects to GitHub authorization screen
        '401':
          description: Unauthorized — invalid or expired link code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/oauth/exchange:
    post:
      summary: Exchange ephemeral OAuth code for tokens
      description: Exchanges a single-use ephemeral authorization code (delivered via httpOnly oauth_code cookie from the OAuth callback) for access and refresh tokens. Code is valid for 60 seconds and can only be used once. The cookie is cleared after consumption. No request body required — code is read from the cookie automatically (requires credentials include).
      tags: [OAuth]
      responses:
        '200':
          description: Tokens returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/SafeUser'
                  oauthAction:
                    type: string
                    enum: [created, linked, auto-verified]
                    description: "created: new OAuth account. linked: existing verified account linked. auto-verified: unverified account auto-verified via OAuth provider (passwordHash nullified). Not included on regular login."
        '401':
          description: Invalid, expired, or missing authorization code (oauth_code cookie)
        '429':
          description: Too many exchange attempts — rate limited (10 req/60s per IP)

  # ─── CSRF (SCRUM-27) ────────────────────────────────────

  /auth/csrf-token:
    get:
      summary: Get CSRF token
      description: Returns a CSRF token for use in subsequent state-changing requests. SUPERADMIN full access (bypasses all guards).
      tags: [Authentication]
      responses:
        '200':
          description: CSRF token returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string

  # ─── Sessions (SCRUM-26) ───────────────────────────────

  /auth/logout-all:
    post:
      summary: Logout from all sessions
      description: Revokes all active sessions for the authenticated user. Requires valid JWT. SUPERADMIN full access (bypasses all guards).
      tags: [Sessions]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/sessions:
    get:
      summary: List active sessions
      description: Returns all active (non-revoked) sessions for the authenticated user. Requires valid JWT. SUPERADMIN full access (bypasses all guards).
      tags: [Sessions]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active sessions list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    deviceInfo:
                      type: string
                      nullable: true
                    ipAddress:
                      type: string
                    userAgent:
                      type: string
                      nullable: true
                    createdAt:
                      type: string
                      format: date-time
                    lastUsedAt:
                      type: string
                      format: date-time

  /auth/sessions/{id}:
    delete:
      summary: Revoke a specific session
      description: Revokes a single session by ID. User can only revoke their own sessions. Requires valid JWT. SUPERADMIN full access (bypasses all guards).
      tags: [Sessions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Session not found

  # ─── Trusted Devices (SCRUM-107) ──────────────────────

  /auth/trusted-devices:
    post:
      summary: Mark current device as trusted
      description: |
        Registers a device fingerprint as trusted, allowing MFA to be skipped on future logins from this device for the configured TTL (default 30 days). Rate-limited to 5 req/60s.
        **SCRUM-327**: Requires password re-authentication (OWASP ASVS V2.8). OAuth-only users (no `passwordHash`) get 400 with `PASSWORD_REQUIRED_NO_PASSWORD`.
      tags: [Trusted Devices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint, password]
              properties:
                fingerprint:
                  type: string
                  minLength: 16
                  maxLength: 512
                  description: Opaque device fingerprint string from the client
                password:
                  type: string
                  minLength: 1
                  description: Current account password for re-authentication (SCRUM-327)
      responses:
        '201':
          description: Device trusted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  deviceName:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          description: Password required or OAuth-only user (no passwordHash)
        '401':
          description: Invalid password or Unauthorized
        '429':
          description: Too many requests
    get:
      summary: List trusted devices for current user
      description: Returns all active (non-revoked, non-expired) trusted devices for the authenticated user.
      tags: [Trusted Devices]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of trusted devices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    deviceName:
                      type: string
                    ipAddress:
                      type: string
                    lastVerifiedAt:
                      type: string
                      format: date-time
                    expiresAt:
                      type: string
                      format: date-time
                    createdAt:
                      type: string
                      format: date-time
        '401':
          description: Unauthorized
    delete:
      summary: Revoke all trusted devices
      description: |
        Revokes trust for all devices belonging to the authenticated user.
        **SCRUM-327**: Requires password re-authentication. Body sent via `apiClient.deleteWithBody`.
      tags: [Trusted Devices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 1
                  description: Current account password for re-authentication (SCRUM-327)
      responses:
        '200':
          description: All trusted devices revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer
        '400':
          description: Password required or OAuth-only user
        '401':
          description: Invalid password or Unauthorized

  /auth/trusted-devices/{id}:
    delete:
      summary: Revoke trust for a specific device
      description: |
        Revokes trust for a single device by ID. User can only revoke their own devices.
        **SCRUM-327**: Requires password re-authentication. Body sent via `apiClient.deleteWithBody`.
      tags: [Trusted Devices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 1
                  description: Current account password for re-authentication (SCRUM-327)
      responses:
        '200':
          description: Device trust revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid UUID format, password required, or OAuth-only user
        '401':
          description: Invalid password or Unauthorized
        '404':
          description: Device not found

  # ─── Email Verification & Password Reset (SCRUM-29) ────

  /auth/verify-email:
    post:
      summary: Verify email address
      description: |
        Verifies a user's email address using a token sent via email. The frontend extracts the token from the email link's query string and POSTs it in the request body (OWASP ASVS V8.3.1). Returns JSON status. No authentication required. CSRF skipped (unauthenticated flow). Rate-limited to 10 requests per minute.
      tags: [Email Verification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Email verification token from the verification email
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success, already_verified, invalid, expired]

  /auth/verify-email-change:
    post:
      summary: Verify email change via token
      description: |
        Verifies a user's new email address using a token sent to the new email. Atomically swaps the email, clears pendingEmail, revokes all sessions, and sends a confirmation to the old email. The frontend extracts the token from the email link's query string and POSTs it in the request body (OWASP ASVS V8.3.1). Returns JSON status. No authentication required. CSRF skipped (unauthenticated flow). Rate-limited to 10 requests per minute. Cross-flow guard rejects REGISTRATION tokens.
      tags: [Email Verification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Email change verification token from the verification email
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success, invalid]

  /auth/resend-verification:
    post:
      summary: Resend email verification
      description: Sends a new email verification token to the authenticated user's email. Requires valid JWT. SUPERADMIN full access (bypasses all guards).
      tags: [Email Verification]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/forgot-password:
    post:
      summary: Request password reset
      description: Sends a password reset link to the specified email address. Always returns 200 to prevent user enumeration.
      tags: [Email Verification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                turnstileToken:
                  type: string
                  description: Cloudflare Turnstile CAPTCHA token (optional — validated server-side when Turnstile is enabled)
      responses:
        '200':
          description: If the email exists, a reset link was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '429':
          description: Too many recovery attempts (3 per 15min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'

  /auth/reset-password:
    post:
      summary: Reset password with token
      description: Resets the user's password using a valid reset token. Rejects if new password matches current password (OWASP). All active sessions are revoked after successful reset.
      tags: [Email Verification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  description: Password reset token from the reset email
                newPassword:
                  type: string
                  minLength: 8
                  description: New password — minimum 8 characters. No composition requirements enforced.
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid or expired token, same password as current, or breached password (HIBP)
        '429':
          description: Too many reset attempts (5 per 60s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'

  /auth/validate-reset-token:
    post:
      summary: Validate a password reset token
      description: Checks if a password reset token is valid without consuming it. Used by the frontend to detect expired/invalid tokens on page load and redirect to forgot-password. The token is submitted in the request body (not as a query parameter) to avoid it appearing in server logs or browser history.
      tags: [Email Verification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Password reset token from the reset email
      responses:
        '200':
          description: Token validity status
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean

  /auth/resend-verification-public:
    post:
      summary: Resend email verification (public)
      description: Sends a new verification email without requiring authentication. Silently succeeds for non-existent accounts, already-verified accounts, and cooldown-active accounts (anti-enumeration). Rate limited to 3 requests per 15 minutes.
      tags: [Email Verification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                turnstileToken:
                  type: string
                  description: Cloudflare Turnstile CAPTCHA token (required by TurnstileGuard)
      responses:
        '200':
          description: Generic success message (anti-enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '429':
          description: Too many requests (3 per 15min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'

  # ─── MFA (SCRUM-28) ───────────────────────────────────

  /auth/mfa/setup:
    post:
      summary: Initialize MFA setup
      description: Generates a TOTP secret and returns a QR code URI for the authenticator app. Accepts JWT or MFA setup token (issued when admin login requires MFA setup).
      tags: [MFA]
      security:
        - bearerAuth: []
        - mfaSetupToken: []
      responses:
        '200':
          description: MFA setup data
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                    description: TOTP secret (base32 encoded)
                  qrCodeDataUrl:
                    type: string
                    description: Data URL of the QR code image for authenticator app scanning
                  recoveryCodes:
                    type: array
                    items:
                      type: string
                    description: One-time recovery codes (store securely — only shown once)
        '401':
          description: Unauthorized — invalid or missing JWT
        '409':
          description: MFA already enabled for this account
        '429':
          description: Too many MFA setup attempts (5 per 60s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'

  /auth/mfa/verify-setup:
    post:
      summary: Verify and activate MFA
      description: Verifies a TOTP code to confirm MFA setup. On success, MFA is enabled and recovery codes are returned. Accepts JWT or MFA setup token.
      tags: [MFA]
      security:
        - bearerAuth: []
        - mfaSetupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: 6-digit TOTP code from authenticator app
      responses:
        '200':
          description: MFA enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid TOTP code
        '429':
          description: Too many MFA verify-setup attempts (5 per 60s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'

  /auth/mfa/verify-login:
    post:
      summary: Verify MFA code during login
      description: |
        Verifies a TOTP code or recovery code during login for users with MFA enabled.
        Does NOT require JWT authentication — accepts a temporary `mfaToken` issued during the login response.
        Either `code` (TOTP) or `recoveryCode` must be provided.
      tags: [MFA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken]
              properties:
                mfaToken:
                  type: string
                  description: Temporary MFA challenge token from login response
                code:
                  type: string
                  description: 6-digit TOTP code from authenticator app
                recoveryCode:
                  type: string
                  description: Single-use recovery code (if TOTP unavailable)
                trustDevice:
                  type: boolean
                  description: Mark this device as trusted to skip MFA on future logins (30 days). Requires X-Device-Fingerprint header.
                  default: false
      responses:
        '200':
          description: MFA verification successful, JWT tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid MFA code or token
        '429':
          description: Too many MFA verify-login attempts (5 per 60s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'

  /auth/mfa:
    delete:
      summary: Disable MFA
      description: Disables multi-factor authentication for the authenticated user. Clears TOTP secret and recovery codes. Requires password confirmation. Requires valid JWT. SUPERADMIN full access (bypasses all guards).
      tags: [MFA]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  description: Current account password for confirmation
      responses:
        '200':
          description: MFA disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: MFA is not enabled — nothing to disable
        '401':
          description: Unauthorized — invalid or missing JWT, or incorrect password
        '429':
          description: Too many MFA disable attempts (5 per 60s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'

  /auth/mfa/recovery-codes:
    post:
      summary: Regenerate recovery codes
      description: Generates a new set of recovery codes, invalidating the previous ones. Requires password confirmation. Requires valid JWT. SUPERADMIN full access (bypasses all guards).
      tags: [MFA]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  description: Current account password for confirmation
      responses:
        '200':
          description: New recovery codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string
        '429':
          description: Too many recovery code regeneration attempts (5 per 60s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'

  /auth/mfa/status:
    get:
      summary: Get MFA status
      description: Returns whether MFA is enabled for the authenticated user. Requires valid JWT. SUPERADMIN full access (bypasses all guards).
      tags: [MFA]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: MFA status
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfaEnabled:
                    type: boolean
        '401':
          description: Unauthorized — invalid or missing JWT

  # ─── Passkeys / WebAuthn (SCRUM-110) ──────────────────────

  /auth/passkeys/register/options:
    post:
      summary: Generate WebAuthn registration options
      description: |
        Generates registration options for a new passkey. Requires valid JWT. Maximum 10 passkeys per user. Rate limited (5 req/60s).
        **SCRUM-327**: Requires password re-authentication. The WebAuthn challenge is only issued AFTER password verification succeeds — defense at the gate per OWASP ASVS V2.8.
      tags: [Passkeys]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 1
                  description: Current account password for re-authentication (SCRUM-327)
      responses:
        '201':
          description: Registration options (PublicKeyCredentialCreationOptions)
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Max passkeys reached, password required, or OAuth-only user
        '401':
          description: Invalid password or Unauthorized
        '429':
          description: Rate limit exceeded

  /auth/passkeys/register/verify:
    post:
      summary: Verify WebAuthn registration and store passkey
      description: Verifies the registration attestation response and stores the new passkey credential. Requires valid JWT. Rate limited (5 req/60s).
      tags: [Passkeys]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: object
                  description: WebAuthn RegistrationResponseJSON from the authenticator
                name:
                  type: string
                  maxLength: 64
                  description: Optional display name for the passkey
      responses:
        '201':
          description: Passkey registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
        '400':
          description: Registration challenge not found or expired
        '401':
          description: Verification failed
        '429':
          description: Rate limit exceeded

  /auth/passkeys/login/options:
    post:
      summary: Generate WebAuthn authentication options
      description: Generates authentication options for passkey login. Public endpoint (no JWT). If email provided, includes allowCredentials for the user's passkeys. Anti-enumeration — no error if unknown email. Rate limited (10 req/60s).
      tags: [Passkeys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Optional email to scope authentication to a specific user
      responses:
        '200':
          description: Authentication options and challenge ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  options:
                    type: object
                    description: PublicKeyCredentialRequestOptions
                  challengeId:
                    type: string
                    format: uuid
        '429':
          description: Rate limit exceeded

  /auth/passkeys/login/verify:
    post:
      summary: Verify WebAuthn authentication and issue tokens
      description: Verifies the authentication assertion response, validates sign count, issues JWT tokens, and creates a session. Public endpoint (no JWT). Rate limited (10 req/60s).
      tags: [Passkeys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential, challengeId]
              properties:
                credential:
                  type: object
                  description: WebAuthn AuthenticationResponseJSON from the authenticator
                challengeId:
                  type: string
                  description: Challenge ID from login/options response
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Authentication failed
        '403':
          description: Account deactivated
        '429':
          description: Rate limit exceeded

  /auth/passkeys:
    get:
      summary: List passkeys
      description: Returns all passkeys for the authenticated user, ordered by creation date (newest first). Requires valid JWT.
      tags: [Passkeys]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of passkeys
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    deviceType:
                      type: string
                      enum: [singleDevice, multiDevice]
                    backedUp:
                      type: boolean
                    transports:
                      type: array
                      items:
                        type: string
                    lastUsedAt:
                      type: string
                      format: date-time
                      nullable: true
                    createdAt:
                      type: string
                      format: date-time
        '401':
          description: Unauthorized

  /auth/passkeys/{id}:
    patch:
      summary: Rename a passkey
      description: Updates the display name of a passkey. Requires valid JWT. Only the owner can rename.
      tags: [Passkeys]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        '200':
          description: Passkey renamed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
        '404':
          description: Passkey not found
    delete:
      summary: Delete a passkey
      description: |
        Deletes a passkey. Requires valid JWT. Rate limited (5 req/60s).
        **SCRUM-327**: Requires password re-authentication (mandatory). OAuth-only users (no `passwordHash`) get 400 with `PASSWORD_REQUIRED_NO_PASSWORD`. Body sent via `apiClient.deleteWithBody`.
      tags: [Passkeys]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 1
                  description: Current account password for re-authentication (SCRUM-327)
      responses:
        '200':
          description: Passkey deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Password required or OAuth-only user (no passwordHash)
        '401':
          description: Invalid password
        '404':
          description: Passkey not found
        '429':
          description: Rate limit exceeded

  # ─── Audit Logs (SCRUM-25) ─────────────────────────────

  /audit-logs:
    get:
      summary: List audit logs
      description: Returns a paginated list of audit log entries. Requires ADMIN role with audit-logs:read permission. SUPERADMIN full access (bypasses all guards).
      tags: [Audit Logs]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: action
          in: query
          schema:
            type: string
          description: Filter by AuditAction enum value
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by acting user ID
      responses:
        '200':
          description: Paginated audit logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogResponse'
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
        '403':
          description: Forbidden — requires ADMIN with audit-logs:read

  /audit-logs/{id}:
    get:
      summary: Get audit log by ID
      description: Returns a single audit log entry by ID. Requires ADMIN role with audit-logs:read permission. SUPERADMIN full access (bypasses all guards).
      tags: [Audit Logs]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audit log entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'
        '400':
          description: Invalid UUID format
        '404':
          description: Audit log not found

  # ─── Users ──────────────────────────────────────────────

  /users:
    get:
      summary: List all users
      description: Returns a paginated list of users. Requires ADMIN or SUPERADMIN role.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - name: role
          in: query
          schema:
            type: string
            enum: [USER, ADMIN, SUPERADMIN]
          description: Filter by role
        - name: isActive
          in: query
          schema:
            type: boolean
          description: Filter by active status
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SafeUser'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}:
    get:
      summary: Get user by ID
      description: Returns a user's profile by ID. Requires ADMIN or SUPERADMIN role.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeUser'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update user (admin)
      description: Updates a user's role or active status. Requires ADMIN or SUPERADMIN role. Only SUPERADMIN can assign ADMIN/SUPERADMIN roles.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserDto'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeUser'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Deactivate user
      description: Soft-deletes a user by setting isActive to false. Requires ADMIN role with `users:delete` permission. SUPERADMIN full access (bypasses all guards).
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Forbidden — requires ADMIN role with users:delete permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    patch:
      summary: Update own profile
      description: Updates the authenticated user's profile (firstName, lastName, avatar).
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileDto'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeUser'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete own account (GDPR erasure)
      description: |
        Self-service account deletion with GDPR Article 17 compliance. Local accounts require password confirmation; OAuth-only accounts can delete without password (JWT auth sufficient). The user record is preserved as a tombstone with anonymized PII. All sessions, verification tokens, and password reset tokens are hard-deleted. Audit log metadata/IP/UA is scrubbed. A confirmation email is sent before anonymization. SUPERADMIN accounts cannot be self-deleted.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountDto'
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Password confirmation required (local accounts) or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Password is incorrect or not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: SUPERADMIN accounts cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/avatar:
    post:
      summary: Upload avatar (with optional original for re-editing)
      description: |
        Accepts multipart/form-data with two file fields: `avatar` (required, cropped image) and `original` (optional, full original image for future re-editing).
        Also accepts a `cropData` JSON string field with percentage-based and pixel-based crop coordinates.
        Validates file type (JPEG, PNG, WebP) and size (max 5MB combined).
        Stores files locally via StorageModule. Old avatar and original files are deleted before saving new ones.
        On re-edit (no original sent), the existing original is preserved.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Cropped avatar image (JPEG/PNG/WebP, max 5MB)
                original:
                  type: string
                  format: binary
                  description: Original uncropped image (optional, for re-editing)
                cropData:
                  type: string
                  description: JSON string with crop coordinates (areaPercent + areaPixels)
      responses:
        '201':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarUrl:
                    type: string
                    example: /uploads/avatars/uuid-123-1713200000.jpg
                  avatarOriginalUrl:
                    type: string
                    nullable: true
                    example: /uploads/originals/uuid-123-1713200000-original.jpg
                  avatarCropData:
                    type: object
                    nullable: true
        '400':
          description: Avatar file is required
        '401':
          description: Unauthorized
    delete:
      summary: Remove avatar
      description: |
        Removes the user's avatar, original file, and crop data.
        Sets avatarUrl, avatarOriginalUrl to null and avatarCropData to JsonNull.
        Deletes local files from /uploads/avatars/ and /uploads/originals/.
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Avatar removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarUrl:
                    type: 'null'
        '401':
          description: Unauthorized
  /users/me/password:
    patch:
      summary: Change own password
      description: Changes the authenticated user's password. Requires current password verification. Revokes all refresh tokens on success.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDto'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Breached password (HIBP k-anonymity check)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/email:
    post:
      summary: Request email change
      description: Initiates an email change flow. Requires password confirmation. Stores the new email as pendingEmail, creates an EMAIL_CHANGE verification token, sends verification to the new email, and sends a security notification to the old email. Rate limited to 5 requests per minute.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailDto'
      responses:
        '200':
          description: Verification email sent to new address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Same email, OAuth-only account, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests (rate limited)

  /users/me/oauth:
    get:
      summary: List linked OAuth providers
      description: |
        Returns an array of OAuth providers currently linked to the authenticated user's account.
        Each entry includes the provider name, provider-side user ID, email, and link timestamp.
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of linked OAuth providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkedProvider'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/oauth/{provider}:
    delete:
      summary: Unlink OAuth provider
      description: |
        Unlinks the specified OAuth provider (Google/GitHub) from the user's account, converting the account to a local email/password account. Requires password confirmation — OAuth-only users (no password set) cannot unlink until they set one. All sessions and trusted devices are revoked after unlinking. Rate limited to 5 requests per minute.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
          description: The OAuth provider to unlink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlinkOAuthDto'
      responses:
        '200':
          description: OAuth provider unlinked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Already local provider, no password set, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid password or not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found or provider not linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests (rate limited)

  /users/me/security-activity:
    get:
      summary: Get user's own security activity
      description: |
        Returns a paginated list of audit log entries where the authenticated user is the actor (userId). Results are ordered by createdAt DESC (most recent first). Only exposes: id, action, ipAddress, userAgent, metadata, createdAt. Does not expose userId, targetUserId, or user relations. Protected by JwtAuthGuard only — any authenticated user can access their own activity.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated security events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecurityEvent'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Projects ───────────────────────────────────────────

  /projects:
    post:
      summary: Create a new project
      description: Creates a new project. The authenticated user becomes the OWNER. A FREE subscription and default modules are created automatically.
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectDto'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Project slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List user's projects
      description: Returns a paginated list of projects the authenticated user is a member of.
      tags: [Projects]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, ARCHIVED, SUSPENDED]
          description: Filter by project status
      responses:
        '200':
          description: Paginated project list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectResponse'

  /projects/{id}:
    get:
      summary: Get project details
      description: Returns project details including member count. Requires project membership.
      tags: [Projects]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '403':
          description: Not a project member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update project
      description: Updates project name, description, or status. Requires OWNER or ADMIN member role.
      tags: [Projects]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectDto'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '403':
          description: Insufficient member role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Archive project
      description: Sets project status to ARCHIVED. Requires OWNER member role. Archived projects are read-only.
      tags: [Projects]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Project archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Only OWNER can archive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/members:
    get:
      summary: List project members
      description: Returns all members of a project with their roles. Requires project membership.
      tags: [Projects]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMemberResponse'
    post:
      summary: Add project member
      description: Adds a user to the project with a specified role. Requires OWNER or ADMIN member role.
      tags: [Projects]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberDto'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User is already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/members/{userId}:
    delete:
      summary: Remove project member
      description: Removes a user from the project and all its teams. Requires OWNER or ADMIN member role. OWNER cannot be removed.
      tags: [Projects]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Cannot remove OWNER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Teams ──────────────────────────────────────────────

  /projects/{projectId}/teams:
    post:
      summary: Create a team
      description: Creates a new team within a project. Requires OWNER or ADMIN member role.
      tags: [Teams]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamDto'
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '409':
          description: Team name already exists in this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List project teams
      description: Returns all teams in a project. Requires project membership.
      tags: [Teams]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          description: Team list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamResponse'

  /projects/{projectId}/teams/{teamId}:
    get:
      summary: Get team details
      description: Returns team details with members. Requires project membership.
      tags: [Teams]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/TeamIdParam'
      responses:
        '200':
          description: Team details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDetailResponse'
        '404':
          description: Team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update team
      description: Updates team name or description. Requires OWNER or ADMIN member role in the project.
      tags: [Teams]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/TeamIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamDto'
      responses:
        '200':
          description: Team updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
    delete:
      summary: Delete team
      description: Deletes a team and all its memberships. Requires OWNER or ADMIN member role in the project.
      tags: [Teams]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/TeamIdParam'
      responses:
        '200':
          description: Team deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /projects/{projectId}/teams/{teamId}/members:
    post:
      summary: Add team member
      description: Adds a project member to a team. The user must already be a project member.
      tags: [Teams]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/TeamIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberDto'
      responses:
        '201':
          description: Member added to team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberResponse'
        '404':
          description: User is not a project member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User is already a team member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{projectId}/teams/{teamId}/members/{userId}:
    delete:
      summary: Remove team member
      description: Removes a user from a team. Requires OWNER or ADMIN member role in the project.
      tags: [Teams]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/TeamIdParam'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Member removed from team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # ─── Notifications ──────────────────────────────────────

  /notifications:
    get:
      summary: List user notifications
      description: Returns a paginated list of notifications for the authenticated user. Filterable by type and status.
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: type
          in: query
          schema:
            type: string
            enum: [SYSTEM, PROJECT, TEAM, BILLING]
          description: Filter by notification type
        - name: status
          in: query
          schema:
            type: string
            enum: [UNREAD, READ, ARCHIVED]
          description: Filter by status (default excludes ARCHIVED)
      responses:
        '200':
          description: Paginated notification list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NotificationResponse'

  /notifications/{id}/read:
    patch:
      summary: Mark notification as read
      description: Sets the notification status to READ and records the readAt timestamp.
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notifications/read-all:
    patch:
      summary: Mark all notifications as read
      description: Sets all UNREAD notifications for the authenticated user to READ.
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /notifications/{id}/archive:
    patch:
      summary: Archive notification
      description: Sets the notification status to ARCHIVED. Archived notifications are excluded from default queries.
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Notification archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'

  /notifications/{id}:
    delete:
      summary: Delete notification
      description: Permanently deletes a notification. Only the recipient can delete their notifications.
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Notification deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Billing ────────────────────────────────────────────

  /projects/{projectId}/billing/subscription:
    get:
      summary: Get project subscription
      description: Returns the current subscription details for a project. Requires OWNER or ADMIN member role.
      tags: [Billing]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          description: Subscription details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'

  /projects/{projectId}/billing/subscribe:
    post:
      summary: Create or upgrade subscription
      description: Creates a new paid subscription or upgrades the current plan. Requires OWNER member role.
      tags: [Billing]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionDto'
      responses:
        '200':
          description: Subscription created or upgraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '403':
          description: Only OWNER can manage billing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{projectId}/billing/cancel:
    patch:
      summary: Cancel subscription
      description: Cancels the current subscription. Access continues until the end of the current billing period. Requires OWNER member role.
      tags: [Billing]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          description: Subscription canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'

  /projects/{projectId}/billing/invoices:
    get:
      summary: List project invoices
      description: Returns a paginated list of invoices for the project. Requires OWNER or ADMIN member role.
      tags: [Billing]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated invoice list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/InvoiceResponse'

  /projects/{projectId}/billing/invoices/{invoiceId}:
    get:
      summary: Get invoice details
      description: Returns details for a specific invoice. Requires OWNER or ADMIN member role.
      tags: [Billing]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /billing/webhook:
    post:
      summary: Stripe webhook handler
      description: Receives Stripe webhook events (invoice.paid, invoice.payment_failed, customer.subscription.updated, etc.). Validates Stripe signature header. No JWT authentication required.
      tags: [Billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe webhook event payload
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid Stripe signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Settings ───────────────────────────────────────────

  /settings/me:
    get:
      summary: Get user settings
      description: Returns all settings for the authenticated user (scope=USER).
      tags: [Settings]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SettingResponse'

  /settings/me/{key}:
    put:
      summary: Set user setting
      description: Creates or updates a user setting by key.
      tags: [Settings]
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Setting key (e.g., "theme.mode", "notifications.email_enabled")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSettingDto'
      responses:
        '200':
          description: Setting saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'

  /projects/{projectId}/settings:
    get:
      summary: Get project settings
      description: Returns all settings for a project (scope=PROJECT). Requires project membership.
      tags: [Settings]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          description: Project settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SettingResponse'

  /projects/{projectId}/settings/{key}:
    put:
      summary: Set project setting
      description: Creates or updates a project setting by key. Requires OWNER or ADMIN member role.
      tags: [Settings]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSettingDto'
      responses:
        '200':
          description: Setting saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'

  # ─── Modules ────────────────────────────────────────────

  /modules:
    get:
      summary: List platform modules
      description: Returns all available platform modules. Requires authentication.
      tags: [Modules]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Module list
