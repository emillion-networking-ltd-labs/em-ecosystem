            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List project apps
      description: Returns a paginated list of apps in a project. Requires project membership. DRAFT apps are only visible to OWNER, ADMIN, and the creator.
      tags: [Apps]
