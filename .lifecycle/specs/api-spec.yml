                $ref: '#/components/schemas/MessageResponse'

  # ─── Permissions ────────────────────────────────────────

  /permissions:
    get:
      summary: List all permissions
      description: Returns all defined permissions in the system. Requires ADMIN or SUPERADMIN role.
      tags: [Permissions]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Permission list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
        '403':
          description: Forbidden — requires ADMIN or SUPERADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /permissions/roles/{role}:
    get:
      summary: Get permissions for role
      description: Returns all permissions assigned to a specific role. Requires ADMIN or SUPERADMIN role.
      tags: [Permissions]
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [USER, ADMIN, SUPERADMIN]
      responses:
        '200':
          description: Role permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
    put:
      summary: Set permissions for role
      description: Sets the permissions for a role. Requires ADMIN role with permissions:write permission. SUPERADMIN full access (bypasses all guards).
      tags: [Permissions]
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [USER, ADMIN, SUPERADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRolePermissionsDto'
      responses:
        '200':
          description: Permissions updated for role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Forbidden — requires permissions:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Tenants (SCRUM-491 / AUTH v2 Phase 0.4) ────────────

  /tenants/{tenantId}/invitations:
    post:
      tags: [Tenants]
      summary: Create a tenant invitation
      description: |
        Creates a new invitation for the given email + role pair within `:tenantId`.
        Authorized for OWNER/ADMIN of the tenant; platform-admin bypasses the
        role check. Idempotent on `(tenantId, LOWER(email))` for pending
        invitations — duplicate calls return the existing invitation with
        `token: null` (the plaintext is irrecoverable; coordinate out-of-band).
        DB-enforced via partial unique index `uniq_tenant_invitation_pending`.
        Rate-limited via `THROTTLE_CONFIGS.sensitiveAction` (~10 req/min/IP).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                role: { type: string, enum: [OWNER, ADMIN, MEMBER, VIEWER, CUSTOM] }
                expiresInDays: { type: integer, minimum: 1, maximum: 30, default: 7 }
      responses:
        '201':
          description: Invitation created (or existing returned if pending duplicate)
          content:
            application/json:
              schema:
                type: object
                required: [id, tenantId, email, role, token, expiresAt, createdAt]
                properties:
                  id: { type: string, format: uuid }
                  tenantId: { type: string, format: uuid }
                  email: { type: string }
                  role: { type: string, enum: [OWNER, ADMIN, MEMBER, VIEWER, CUSTOM] }
                  token:
                    type: string
                    nullable: true
                    description: Plaintext token. NON-NULL only on a fresh create; null on idempotent duplicate.
                  expiresAt: { type: string, format: date-time }
                  createdAt: { type: string, format: date-time }
        '400':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tenant not found OR caller is not OWNER/ADMIN (intentionally indistinguishable — hides tenant existence)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tenants/invitations/accept:
    post:
      tags: [Tenants]
      summary: Accept a tenant invitation by token
      description: |
        Accepts an invitation by submitting the plaintext token received
        out-of-band. Materializes a `TenantMembership` for the authenticated
        user (atomic via `$transaction`). Idempotent re-accept by the same
        user returns the existing membership.

        Rejection paths each emit a dedicated security audit event:
        - Expired token → `410 Gone` + `TENANT_INVITATION_EXPIRE_REJECTED`
        - Email mismatch (case-insensitive) → `403 Forbidden` + `TENANT_INVITATION_EMAIL_MISMATCH_REJECTED`
        - Token not found → `404 Not Found` (no audit; no information to log)
        - Already accepted by different user → `409 Conflict`

        Rate-limited via `THROTTLE_CONFIGS.sensitiveAction`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 40
                  maxLength: 64
                  description: Plain-text invitation token (43-char base64url canonical).
      responses:
        '200':
          description: Membership materialized
          content:
            application/json:
              schema:
                type: object
                required: [membershipId, tenantId, role, status]
                properties:
                  membershipId: { type: string, format: uuid }
                  tenantId: { type: string, format: uuid }
                  role: { type: string, enum: [OWNER, ADMIN, MEMBER, VIEWER, CUSTOM] }
                  status: { type: string, enum: [active, invited, suspended] }
        '403':
          description: Email mismatch — authenticated user is not the invitation target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Invitation token not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Invitation already accepted by a different user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '410':
          description: Invitation expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tenants/{tenantId}/invitations/{invitationId}:
    delete:
      tags: [Tenants]
      summary: Revoke a pending tenant invitation
      description: |
        Hard-deletes a pending invitation. Authorized for OWNER/ADMIN of the
        tenant; platform-admin bypasses the role check. Already-accepted
        invitations cannot be revoked (use member removal in Phase 2+).
        Audit row `TENANT_INVITATION_REVOKED` carries the evidence trail.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Invitation hard-deleted
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Invitation not found in :tenantId (or caller lacks OWNER/ADMIN role — indistinguishable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Invitation has already been accepted; cannot be revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tenants/{tenantId}/members:
    get:
      tags: [Tenants]
      summary: List members of a tenant
      description: |
        Paginated listing of all TenantMembership rows for `:tenantId`. Any
        active member of the tenant can list (no role restriction). Platform
        admin bypasses the membership check.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Paginated member list
          content:
            application/json:
              schema:
                type: object
                required: [data, page, pageSize, total]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [userId, email, role, status, joinedAt, lastActiveAt]
                      properties:
                        userId: { type: string, format: uuid }
                        email: { type: string }
                        role: { type: string, enum: [OWNER, ADMIN, MEMBER, VIEWER, CUSTOM] }
                        status: { type: string, enum: [active, invited, suspended] }
                        joinedAt: { type: string, format: date-time }
                        lastActiveAt: { type: string, format: date-time }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tenant not found OR caller is not a member (intentionally indistinguishable — hides tenant existence)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ─── Organizations (SCRUM-495 / AUTH v2 Phase 2.1) ────────────

  /tenants/{tenantId}/organizations:
    get:
      tags: [Organizations]
      summary: List organizations within a tenant
      description: |
        Returns all Organizations belonging to `:tenantId`. Any active member of the
        tenant can list (no role restriction). Platform admin bypasses the membership
        check but is additionally checked via `TenantsService.findById` to confirm the
        tenant exists. Cross-tenant denial returns 404 to hide tenant existence.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of organizations (may be empty array)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrganizationResponse' }
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tenant not found OR caller is not a member (intentionally indistinguishable — hides tenant existence)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [Organizations]
      summary: Create a new organization within a tenant (OWNER or ADMIN only)
      description: |
        Creates a new `Organization` scoped to `:tenantId`. Requires the caller to be
        either OWNER or ADMIN of the tenant (or platform admin). 404 on insufficient
        role (hides tenant existence). 409 on slug already in use within the tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: Engineering
                slug:
                  type: string
                  pattern: '^[a-z][a-z0-9-]*$'
                  maxLength: 50
                  example: engineering
                description:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400':
          description: Validation failure (slug pattern, length, missing fields)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tenant not found OR caller is not OWNER/ADMIN (intentionally indistinguishable — hides tenant existence)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Organization slug already in use within this tenant (translated from Prisma P2002)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tenants/{tenantId}/organizations/{orgId}:
    get:
      tags: [Organizations]
      summary: Get organization by id (tenant-scoped)
      description: |
        Returns the Organization identified by `:orgId` IF it belongs to `:tenantId`.
        Cross-tenant access (org exists but belongs to a different tenant) returns 404
        to hide existence (handled inside `OrganizationsService.findById`).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: orgId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Organization not found (does not exist, or exists in another tenant, or caller is not a member of the tenant — intentionally indistinguishable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /organizations/{orgId}/members:
    post:
      tags: [Organizations]
      summary: Add a user to an organization (org OWNER/ADMIN or platform admin)
      description: |
        Adds `userId` to the Organization with the given `role`. Caller must either be
        a platform admin OR an existing OWNER/ADMIN of the Organization. Non-OWNER/ADMIN
        org members get 404 (hides org existence). 409 if user is already a member.
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: string, format: uuid }
                role:
                  type: string
                  enum: [OWNER, ADMIN, MEMBER, VIEWER]
      responses:
        '201':
          description: Membership created
          content:
            application/json:
              schema:
                type: object
                required: [id, organizationId, userId, role]
                properties:
                  id: { type: string, format: uuid }
                  organizationId: { type: string, format: uuid }
                  userId: { type: string, format: uuid }
                  role: { type: string, enum: [OWNER, ADMIN, MEMBER, VIEWER] }
        '400':
          description: Validation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Organization not found OR caller is not OWNER/ADMIN of the org (intentionally indistinguishable — hides org existence)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: User is already a member of this organization (translated from Prisma P2002)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ─── Auth v2 — AuthIntent (SCRUM-497 / AUTH v2 Phase 2.2) ────────────

  /auth/v2/intents:
    post:
      tags: [Auth v2 — AuthIntent]
      summary: Create a new AuthIntent (v2 login orchestration)
      description: |
        Initializes a server-side state-machine for v2 login orchestration. Returns
        the intent id + initial status `requires_credentials` + the next-step hint.
        The client then calls `POST /auth/v2/intents/:id/advance` repeatedly with
        per-kind input until the intent reaches `succeeded` (or any terminal state).

        Behind the feature flag `app.authIntentV2Enabled` (env `AUTH_INTENT_V2_ENABLED`).
        Returns 404 when the flag is `false` — mimics "endpoint doesn't exist".

        Rate-limited at `AUTH_RATE_LIMITS.login` (10/min global).
      requestBody:
        required: false
        description: Empty body. Request meta (IP + UA) extracted from the request.
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Intent created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthIntentResponse' }
        '404':
          description: v2 AuthIntent disabled (feature flag off)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Too many requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLimitErrorResponse' }

  /auth/v2/intents/{id}/advance:
    post:
      tags: [Auth v2 — AuthIntent]
      summary: Advance an AuthIntent state machine
      description: |
        Applies the next state transition based on `body.kind`. Discriminated union body:
        - `kind: 'credentials'` — `{ email, password }` advances from `requires_credentials`
        - `kind: 'mfa'` — `{ code }` XOR `{ recoveryCode }` advances from `requires_mfa`
        - `kind: 'tenant_pick'` — `{ tenantId }` advances from `requires_tenant_pick`
        - `kind: 'passkey'` — Phase 3 reserves this slot; transition NOT wired in 2.2

        On `succeeded`: returns `accessToken` + `user` payload and sets the httpOnly
        `refresh_token_v2` cookie (httpOnly + secure-in-prod + sameSite=strict + path=/,
        maxAge from `auth.jwtRefreshExpiration`).

        Single throw site: 11 distinct failure reasons all return `401 Authentication
        failed`. Terminal-state replay (succeeded/failed/expired) returns `410 Gone`.
        Intent not found (or feature flag off) returns 404.

        Rate-limited at `AUTH_RATE_LIMITS.login` (10/min global).
      parameters:
        - name: id
          in: path
          required: true
          description: AuthIntent id (UUID)
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdvanceAuthIntentRequest' }
      responses:
        '200':
          description: Intent advanced (non-terminal) OR succeeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthIntentResponse' }
          headers:
            Set-Cookie:
              description: Sets `refresh_token_v2` cookie when status='succeeded'
              schema: { type: string }
        '400':
          description: Validation failure (malformed body, unknown kind)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
        '401':
          description: Authentication failed (any of the 11 distinct reasons — discrimination only in audit log)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Intent not found OR feature flag disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '410':
          description: Intent terminal (already succeeded/failed/expired — replay rejected)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Too many requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLimitErrorResponse' }


# ─── Components ─────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login
    mfaSetupToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: MFA setup token issued when admin login requires MFA setup (JwtOrMfaSetupGuard)

  # ─── Reusable Parameters ────────────────────────────────

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource unique identifier

    ProjectIdParam:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Project unique identifier

    TeamIdParam:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Team unique identifier

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Items per page (max 100)

    SortByParam:
      name: sortBy
      in: query
      schema:
        type: string
        default: createdAt
      description: Field to sort by

    SortOrderParam:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      description: Sort direction

  # ─── Schemas ────────────────────────────────────────────

  schemas:

    # ── Auth DTOs ───────────────────────────────────────

    RegisterDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        password:
          type: string
          minLength: 8
          description: Minimum 8 characters. No composition requirements enforced.
          example: mypassword1
        turnstileToken:
          type: string
          description: Cloudflare Turnstile CAPTCHA token (optional — validated server-side when Turnstile is enabled)

    LoginDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          description: User password (minimum 8 characters)
          example: mypassword1
        turnstileToken:
          type: string
          description: Cloudflare Turnstile CAPTCHA token (optional — validated server-side when Turnstile is enabled)

    # ── User DTOs ───────────────────────────────────────

    UpdateProfileDto:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 100
          description: User's first name
          example: John
        lastName:
          type: string
          maxLength: 100
          description: User's last name
          example: Doe
        avatar:
          type: string
          format: uri
          maxLength: 500
          description: Profile avatar URL

    ChangePasswordDto:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          description: Current password for verification
        newPassword:
          type: string
          minLength: 8
          description: New password — minimum 8 characters. No composition requirements enforced.

    ChangeEmailDto:
      type: object
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          format: email
          description: New email address to change to
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Current account password for verification

    DeleteAccountDto:
      type: object
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Current account password for verification (required for local accounts, optional for OAuth-only accounts)

    UnlinkOAuthDto:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Current account password for verification (required — OAuth-only users must set a password first)

    AdminUpdateUserDto:
      type: object
      properties:
        role:
          type: string
          enum: [USER, ADMIN, SUPERADMIN]
          description: New role (SUPERADMIN can assign any role, ADMIN can only assign USER)
        isActive:
          type: boolean
          description: Active status (false = soft-delete)

    # ── Project DTOs ────────────────────────────────────

    CreateProjectDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Project name
          example: My NexaCore Project
        description:
          type: string
          maxLength: 500
          description: Project description

    UpdateProjectDto:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
          description: Project status (only OWNER can archive)

    AddMemberDto:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          format: uuid
          description: ID of the user to add
        role:
          type: string
          enum: [ADMIN, MEMBER, VIEWER]
          default: MEMBER
          description: Member role (OWNER cannot be assigned — it's automatic for the creator)

    # ── Team DTOs ───────────────────────────────────────

    CreateTeamDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Team name (unique within project)
          example: Backend Team
        description:
          type: string
          maxLength: 255

    UpdateTeamDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 255

    # ── App DTOs ────────────────────────────────────────

    CreateAppDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Application name
          example: Customer Portal
        description:
          type: string
          maxLength: 500
        config:
          type: string
          maxLength: 10000
          description: JSON configuration string

    UpdateAppDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        config:
          type: string
          maxLength: 10000

    # ── Settings DTOs ───────────────────────────────────

    SetSettingDto:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          maxLength: 5000
          description: Setting value as JSON string
          example: '"dark"'

    # ── Billing DTOs ────────────────────────────────────

    CreateSubscriptionDto:
      type: object
      required:
        - plan
      properties:
        plan:
          type: string
          enum: [PRO, ENTERPRISE]
          description: Target subscription plan
        paymentMethodId:
          type: string
          description: Stripe payment method ID

    # ── Permission DTOs ─────────────────────────────────

    SetRolePermissionsDto:
      type: object
      required:
        - permissionKeys
      properties:
        permissionKeys:
          type: array
          items:
            type: string
          description: Array of permission keys to assign to the role (e.g. ['dashboard:read', 'users:read'])

    # ── Response Schemas ────────────────────────────────

    SafeUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        role:
          type: string
          enum: [USER, ADMIN, SUPERADMIN]
          default: USER
        emailVerified:
          type: boolean
          default: false
        isActive:
          type: boolean
          default: true
        hasPassword:
          type: boolean
          description: Whether the user has a password set (false for OAuth-only accounts)
        mfaEnabled:
          type: boolean
          default: false
        oauthProviders:
          type: array
          items:
            type: string
          description: Provider names from linked OAuth accounts (e.g. ['GOOGLE', 'GITHUB'])
        permissions:
          type: array
          items:
            type: string
          description: Permission keys for the user's role (e.g. ['users:read', 'users:manage']). Only included in GET /auth/me response.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LinkedProvider:
      type: object
      properties:
        provider:
          type: string
          enum: [GOOGLE, GITHUB]
        providerId:
          type: string
          description: User ID on the OAuth provider's side
        email:
          type: string
          format: email
          description: Email associated with this OAuth account
        linkedAt:
          type: string
          format: date-time
          description: When the OAuth provider was linked
      required: [provider, providerId, email, linkedAt]

    SafeUserSummary:
      type: object
      description: Minimal user info for member lists and references
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true

    AuthResponse:
      type: object
      description: |
        The refreshToken is delivered via httpOnly secure cookie (not in the response body).
        See Set-Cookie header in the actual HTTP response.
      properties:
        status:
          type: string
          enum: ['success']
          description: Discriminator field for login response type
        accessToken:
          type: string
          description: JWT access token (expires in 15m)
        user:
          $ref: '#/components/schemas/SafeUser'
      required: [status, accessToken, user]

    MfaChallengeResponse:
      type: object
      description: Returned when user has MFA enabled — client must complete MFA challenge via /auth/mfa/verify-login
      properties:
        status:
          type: string
          enum: ['mfa_required']
          description: Discriminator field for login response type
        mfaToken:
          type: string
          description: Temporary JWT for MFA challenge (expires in 5m)
      required: [status, mfaToken]

    MfaSetupRequiredResponse:
      type: object
      description: Returned when ADMIN/SUPERADMIN has mfaEnabled=false — client must redirect to MFA setup flow (OWASP ASVS V2.7.2)
      properties:
        status:
          type: string
          enum: ['mfa_setup_required']
          description: Discriminator field for login response type
        setupToken:
          type: string
          description: Scope-limited JWT for MFA setup flow (expires in 10m)
        message:
          type: string
          example: 'MFA setup is required for administrator accounts. Please enable MFA to continue.'
      required: [status, setupToken, message]


    TokenResponse:
      type: object
      description: |
        The refreshToken is delivered via httpOnly secure cookie (not in the response body).
        See Set-Cookie header in the actual HTTP response.
      properties:
        accessToken:
          type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Operation completed successfully

    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, ARCHIVED, SUSPENDED]
        ownerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectMemberResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER, VIEWER]
        joinedAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/SafeUserSummary'

    TeamResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        projectId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TeamDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        projectId:
          type: string
          format: uuid
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMemberResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TeamMemberResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER, VIEWER]
        joinedAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/SafeUserSummary'

    NotificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [SYSTEM, PROJECT, TEAM, BILLING]
        status:
          type: string
          enum: [UNREAD, READ, ARCHIVED]
        title:
          type: string
        message:
          type: string
        projectId:
          type: string
          format: uuid
          nullable: true
        actionUrl:
          type: string
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    SubscriptionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        plan:
          type: string
          enum: [FREE, PRO, ENTERPRISE]
        status:
          type: string
          enum: [ACTIVE, PAST_DUE, CANCELED, TRIALING]
        currentPeriodStart:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        canceledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InvoiceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT, PENDING, PAID, FAILED, VOID]
        amount:
          type: number
          format: double
          description: Amount in smallest currency unit (e.g., cents)
        currency:
          type: string
          example: USD
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    SettingResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: theme.mode
        value:
          type: string
          example: '"dark"'
        scope:
          type: string
          enum: [USER, PROJECT, SYSTEM]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlatformModuleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DEPRECATED]
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ProjectModuleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        moduleId:
          type: string
          format: uuid
        module:
          $ref: '#/components/schemas/PlatformModuleResponse'
        enabledAt:
          type: string
          format: date-time
        enabledBy:
          $ref: '#/components/schemas/SafeUserSummary'

    AppResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        projectId:
          type: string
          format: uuid
        createdById:
          type: string
          format: uuid
        config:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PermissionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: projects:create
        description:
          type: string
        resource:
          type: string
          example: projects
        action:
          type: string
          example: create
        createdAt:
          type: string
          format: date-time

    AuditLogResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          description: AuditAction enum value (e.g., LOGIN_SUCCESS, LOGOUT, PASSWORD_CHANGE)
        userId:
          type: string
          format: uuid
          nullable: true
        targetUserId:
          type: string
          format: uuid
          nullable: true
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ── Security Activity ─────────────────────────────────

    SecurityEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          description: Audit action name (e.g., LOGIN_SUCCESS, PASSWORD_CHANGE)
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          description: Action-specific context
        createdAt:
          type: string
          format: date-time

    # ── Common Schemas ──────────────────────────────────

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Items per page
        totalPages:
          type: integer
          description: Total number of pages

    OrganizationResponse:
      type: object
      description: Per-tenant Organization (SCRUM-495 / AUTH v2 Phase 2.1)
      required: [id, tenantId, name, slug, isDefault, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        slug: { type: string, pattern: '^[a-z][a-z0-9-]*$', maxLength: 50 }
        description:
          type: string
          maxLength: 500
          nullable: true
        isDefault:
          type: boolean
          description: True for the default Organization auto-created with each Tenant
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AuthIntentResponse:
      type: object
      description: Response shape for AuthIntent endpoints (SCRUM-497 / Phase 2.2). `accessToken` + `user` present ONLY when `status === 'succeeded'`. `availableTenantIds` present ONLY when `status === 'requires_tenant_pick'`.
      required: [id, status, nextStep, expiresAt]
      properties:
        id:
          type: string
          format: uuid
          description: AuthIntent id
        status:
          type: string
          enum: [requires_credentials, requires_tenant_pick, requires_mfa, requires_passkey, requires_setup, succeeded, failed, expired]
        nextStep:
          type: string
          nullable: true
          enum: [credentials, mfa, tenant_pick, passkey, null]
          description: Hint for the next advance call's `kind`. Null at terminal states.
        expiresAt:
          type: string
          format: date-time
        accessToken:
          type: string
          description: JWT v2 access token (present only when status === 'succeeded')
        user:
          type: object
          description: Resolved user payload (present only when status === 'succeeded')
          required: [id, tenantId, tenantRole, isPlatformAdmin]
          properties:
            id: { type: string, format: uuid }
            tenantId: { type: string, format: uuid }
            tenantRole: { type: string, enum: [OWNER, ADMIN, MEMBER, VIEWER, CUSTOM] }
            isPlatformAdmin: { type: boolean }
        availableTenantIds:
          type: array
          description: Tenant ids the user is an active member of (present only when status === 'requires_tenant_pick')
          items:
            type: string
            format: uuid

    AdvanceAuthIntentRequest:
      type: object
      description: Discriminated request body for `POST /auth/v2/intents/:id/advance`. Per-kind required fields enforced via `@ValidateIf` on the `kind` discriminator. Unknown `kind` → 400.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [credentials, mfa, tenant_pick, passkey]
        email:
          type: string
          format: email
          description: Required when kind='credentials'
        password:
          type: string
          minLength: 8
          description: Required when kind='credentials'
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: TOTP code (6 digits). Required when kind='mfa' AND recoveryCode absent.
        recoveryCode:
          type: string
          minLength: 8
          description: Plaintext recovery code. Required when kind='mfa' AND code absent.
        tenantId:
          type: string
          format: uuid
          description: Required when kind='tenant_pick'
        assertion:
          type: object
          description: WebAuthn assertion. Phase 3 reserves this slot — transition NOT wired in 2.2.

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        meta:
          type: object
          properties:
            total:
              type: integer
              description: Total number of items
            page:
              type: integer
              description: Current page number
            limit:
              type: integer
              description: Items per page
            totalPages:
              type: integer
              description: Total number of pages

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
              example: Email already registered
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMIT_EXCEEDED, INTERNAL_SERVER_ERROR]
              example: CONFLICT
            statusCode:
              type: integer
              example: 409

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
              example: Validation failed
            code:
              type: string
              example: VALIDATION_ERROR
            statusCode:
              type: integer
              example: 400
            details:
              type: array
              items:
                type: string
              example:
                - Password must be at least 8 characters

    RateLimitErrorResponse:
      type: object
      description: >
        Rate limit exceeded. The Retry-After HTTP header indicates seconds until the limit resets.
        Note: retryAfter is no longer included in the response body (SCRUM-140).
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
              example: Too many requests.
            code:
              type: string
              enum: [RATE_LIMIT_EXCEEDED]
              example: RATE_LIMIT_EXCEEDED
            statusCode:
              type: integer
              example: 429
