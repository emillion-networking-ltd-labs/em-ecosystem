              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AppResponse'

  /projects/{projectId}/apps/{appId}:
    get:
      summary: Get app details
      description: Returns details for a specific app. Requires project membership.
      tags: [Apps]
      security:
        - bearerAuth: []
