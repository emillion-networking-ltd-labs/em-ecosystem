                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update app
      description: Updates app name, description, status, or config. Requires OWNER or ADMIN member role.
      tags: [Apps]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppDto'
      responses:
        '200':
          description: App updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
    delete:
      summary: Archive app
      description: Sets app status to ARCHIVED. Requires OWNER or ADMIN member role.
      tags: [Apps]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
