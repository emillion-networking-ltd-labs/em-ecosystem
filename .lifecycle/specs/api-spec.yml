            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # ─── Apps ───────────────────────────────────────────────

  /projects/{projectId}/apps:
    post:
      summary: Create an app
      description: Creates a new application within a project. Requires OWNER or ADMIN member role.
      tags: [Apps]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppDto'
      responses:
        '201':
          description: App created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
        '409':
          description: App slug already exists in this project
