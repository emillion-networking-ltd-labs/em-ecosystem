# Emkeel config (non-secret). Real credentials go in .env / GitHub Secrets.
[jira]
base_url = "https://emillionnetworking-ltd-labs.atlassian.net"
project_key = "ECO"

[github]
repo = "emillion-networking-ltd-labs/em-ecosystem"
runner = "self-hosted"   # Actions runner for emkeel-ci/jira-transition (ubuntu-latest | self-hosted | <label>)
# required_checks: status-check contexts that MUST be required on the default branch. `emkeel
# connect` enforces exactly these; `emkeel doctor` verifies they're enforced (catches "the check
# exists but isn't required"). `gates` is always included. Change with:
#   emkeel set github-required-checks "gates,Security Gate (All Checks)"
required_checks = ["gates", "Security Gate (All Checks)", "Tests & Build Gate"]
# required_approvals: approving reviews branch protection REQUIRES. 0 = solo-friendly (you cannot
# approve your own PR, so 1 would block a lone operator). A team sets 1+; `emkeel connect` installs it.
required_approvals = 0
# enforce_admins: do the rules apply to admins too? false = an admin can push straight to the
# default branch and merge with red checks. strict_up_to_date: must a PR be current with the base
# before merging? Both are RECONCILED by `emkeel update` — set them here, never in the GitHub UI.
enforce_admins = false
strict_up_to_date = false

[architecture]
# surfaces: paths (globs) whose change must be ANSWERED — an ADR in the PR, or `no-adr: <why>` in a
# commit message. The gate never judges whether a change IS architectural; it requires the question
# to be answered while it is still cheap. Empty = dormant.
surfaces = []

[release]
# version_file: the file holding this repo's version (python `__version__`, a TOML `version =`, or
# a package.json `"version"`). package_paths: what the artifact CONTAINS. With both declared, a PR
# that changes the package must bump the version — asked in the PR, where the fix is one line.
# Empty = dormant.
version_file = ""
package_paths = []

[tests]
# command: how to run THIS repo's suite. Empty = the distributed CI runs NO tests, so a regression
# can merge green. Declared = it runs inside the required `gates` job. e.g. "npm test" | "pytest -q"
command = ""

[emkeel]
source = "emkeel~=0.1.0"
generated_with = "0.1.173"   # informational: the Emkeel version that wrote this wiring
